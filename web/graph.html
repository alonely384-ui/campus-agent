<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>引用图谱 · 科研小助手</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- 本地 vendor，不走 CDN：演示环境可能断网，赛题也要求能离线跑 -->
  <script src="vendor/echarts/echarts.min.js"></script>
  <!-- 全站设计系统：变量 + reset + 基础组件。必须在本页 <style> 之前，
       页面规则才能覆盖它。 -->
  <link rel="stylesheet" href="design-system.css" />
  <!-- 图表取色：ECharts 不认 var()，只能把 CSS 变量的计算值读出来再喂给它 -->
  <script src="chart-colors.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-page); height: 100vh; display: flex; flex-direction: column;
      color: var(--text-primary); overflow: hidden;
    }
    header { padding: 12px 18px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
             display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
    h1 { font-size: 16px; font-weight: 600; }
    a.back { font-size: 13px; color: var(--brand); text-decoration: none; }
    a.back:hover { text-decoration: underline; }
    .pill { font-size: 12px; color: var(--text-muted); background: var(--bg-muted); padding: 3px 9px; border-radius: var(--radius-pill); }
    .pill b { color: var(--text-secondary); font-weight: 600; }
    .spacer { flex: 1; }

    #hint { font-size: 12px; color: var(--text-muted); max-width: 640px; line-height: 1.5; }
    /* 社区口径的限定说明：这条必须显眼，否则读者会把"颜色"当成研究领域分类 */
    #commNote {
      margin-top: 6px; padding: 6px 10px; border-radius: 8px;
      background: var(--bg-surface-alt, #f5f6f8);
      border-left: 3px solid var(--warning, #d97706);
      font-size: 11.5px; color: var(--text-muted); max-width: 680px; line-height: 1.55;
    }

    main { flex: 1; display: flex; min-height: 0; }
    #chart { flex: 1; min-width: 0; }
    /* 画布容器：让 #isoBox 能绝对定位到右下角；#chart 自己不能加 position，
       加了会让 ECharts 内部 canvas 定位链失效 */
    #chartWrap { position: relative; flex: 1; min-width: 0; display: flex; }
    #chartWrap > #chart { flex: 1; min-width: 0; }

    /* ---------- 右侧详情栏 ---------- */
    /* z-index 必须显式抬起来：ECharts 的 tooltip 是 z-index:9999999 的绝对定位
       浮层，挂在 #chart 里。aside 在 DOM 中排在 #chartWrap 之后，同为定位元素时
       本来靠后即在上，但 tooltip 若在 9999999 级，就会盖住面板右侧的文字。
       把 aside 放进同一层级比较，并压过 tooltip。 */
    aside { width: 320px; flex-shrink: 0; background: var(--bg-surface); border-left: 1px solid var(--border-color);
            overflow-y: auto; padding: 14px 16px 24px;
            position: relative; z-index: 10000000; }
    aside[hidden] { display: none; }
    .d-title { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
    .d-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0;
             border-bottom: 1px dashed var(--border-color-alt); }
    .d-row span:first-child { color: var(--text-muted); }
    .d-row span:last-child { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .d-open { display: block; margin-top: 14px; text-align: center; background: var(--brand); color: var(--text-inverse);
              font-size: 13px; padding: 9px; border-radius: var(--radius-md); text-decoration: none; }
    .d-open:hover { background: var(--brand-active); }
    .d-open.disabled { background: var(--gray-200); color: var(--text-subtle); pointer-events: none; }
    /* 关闭按钮：右侧详情曾出现"明明点过却找不到"的情况，给个显式关闭 */
    .d-close { position: absolute; top: 10px; right: 12px; width: 24px; height: 24px;
               border: 0; border-radius: var(--radius-sm); background: var(--bg-muted); color: var(--text-muted);
               font-size: 15px; line-height: 1; cursor: pointer; }
    .d-close:hover { background: var(--gray-200); color: var(--text-primary); }
    /* 孤立论文角标：与主图区隔，避免被误读成"它也连在引用网里" */
    #isoBox { position: absolute; right: 14px; bottom: 14px; z-index: 5; max-width: 260px;
              background: var(--bg-surface); border: 1px dashed var(--text-subtle); border-radius: 10px;
              padding: 9px 12px; font-size: 12px; line-height: 1.5;
              box-shadow: var(--shadow-sm); }
    #isoBox[hidden] { display: none; }
    #isoBox .iso-hd { color: var(--text-muted); margin-bottom: 5px; font-size: 11px; letter-spacing: .04em; }
    #isoBox a { display: flex; align-items: center; gap: 6px; color: var(--text-primary);
                text-decoration: none; padding: 3px 4px; border-radius: var(--radius-sm); }
    #isoBox a:hover { background: var(--bg-muted); }
    #isoBox .iso-dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%;
                       border: 1px dashed var(--text-muted); background: var(--chart-c3); }
    #isoBox .iso-tag { flex-shrink: 0; font-size: 10px; background: var(--bg-muted); color: var(--text-subtle);
                       padding: 0 5px; border-radius: var(--radius-sm); }
    .d-sec { font-size: 12px; color: var(--text-subtle); margin: 16px 0 6px; letter-spacing: .04em; }
    .chip { display: inline-block; font-size: 11px; background: var(--bg-muted); color: var(--text-secondary);
            padding: 1px 7px; border-radius: var(--radius-sm); margin: 0 4px 4px 0; }
    .d-list { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
    .d-list a { color: var(--brand); text-decoration: none; }
    .d-list a:hover { text-decoration: underline; }

    /* ---------- 底部待核验区 ---------- */
    #reviewBar { flex-shrink: 0; background: var(--bg-surface); border-top: 1px solid var(--border-color); }
    #reviewBar summary { cursor: pointer; padding: 9px 18px; font-size: 13px; color: var(--text-secondary);
                         list-style: none; user-select: none; }
    #reviewBar summary::-webkit-details-marker { display: none; }
    #reviewBar summary::before { content: "▸ "; color: var(--text-subtle); }
    #reviewBar[open] summary::before { content: "▾ "; }
    #reviewBar summary b { color: var(--warning); }
    /* 榜单每行的度量条：长度 = 当前所选指标在该行里的相对大小，纯视觉辅助 */
    .rk-bar { flex-shrink: 0; width: 54px; height: 5px; border-radius: 3px;
              background: var(--bg-muted); overflow: hidden; align-self: center; }
    .rk-bar > i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
    .rev-wrap { max-height: 34vh; overflow-y: auto; padding: 0 18px 14px; }
    .rev { display: flex; gap: 10px; font-size: 12px; padding: 7px 0; border-top: 1px solid var(--border-color-alt);
           line-height: 1.5; }
    .rev .score { flex-shrink: 0; font-variant-numeric: tabular-nums; color: var(--warning); width: 42px; }
    .rev .t { flex: 1; min-width: 0; color: var(--text-secondary); }
    .rev .t i { color: var(--text-subtle); font-style: normal; }

    /* ---------- 空态 / 加载 ---------- */
    #empty { flex: 1; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 10px; color: var(--text-muted); font-size: 14px; }
    #empty[hidden] { display: none; }
    #empty code { background: var(--bg-muted); padding: 3px 8px; border-radius: var(--radius-sm);
                  font-family: var(--font-mono); color: var(--text-secondary); }

    /* 图例 */
    .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
                   color: var(--text-secondary); margin-right: 12px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* ---------- 基石节点榜（1.5「基石节点挖掘」的可见产物）---------- */
    #csBar { flex-shrink: 0; background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
             padding: 10px 18px 12px; max-height: 30vh; overflow-y: auto; }
    #csTitle { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    #csTitle .sub { font-weight: 400; font-size: 11px; color: var(--text-subtle); margin-left: 6px; }
    #csList { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 4px 18px; }
    .cs-row { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 3px 5px;
              border-radius: var(--radius-sm); cursor: pointer; line-height: 1.4; }
    .cs-row:hover { background: var(--bg-surface-2); }
    .cs-rank { flex-shrink: 0; width: 18px; text-align: right; color: var(--text-subtle);
               font-variant-numeric: tabular-nums; }
    .cs-row:nth-child(-n+3) .cs-rank { color: var(--warning); font-weight: 700; }
    .cs-score { flex-shrink: 0; min-width: 34px; text-align: right; color: var(--text-muted);
                font-variant-numeric: tabular-nums; }
    /* 三种榜的数量级差得很远（被引 22 / PageRank 0.1781 / 中介性 1），
       数值列宽度必须按当前榜的最大位数撑开，否则 "0.981214" 会顶到名字上 */
    .cs-row.at-pagerank .cs-score { min-width: 52px; }
    .cs-row.at-betweenness .cs-score { min-width: 60px; }
    .cs-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               color: var(--text-secondary); padding-left: 2px; }
    .role { flex-shrink: 0; font-size: 10px; padding: 1px 6px; border-radius: var(--radius-sm); white-space: nowrap; }
    /* 六个角色标签：全站统一口径，与 analysis.html 的 .tag.* 读同一组 --role-* 变量 */
    .role-cornerstone { background: var(--role-cornerstone-bg); color: var(--role-cornerstone-fg); }
    .role-hub         { background: var(--role-hub-bg);         color: var(--role-hub-fg); }
    .role-bridge      { background: var(--role-bridge-bg);      color: var(--role-bridge-fg); }
    .role-foundation  { background: var(--role-foundation-bg);  color: var(--role-foundation-fg); }
    .role-fringe      { background: var(--role-fringe-bg);      color: var(--role-fringe-fg); }
    .role-isolated    { background: var(--role-isolated-bg);    color: var(--role-isolated-fg); }
    /* 角色下拉：点「角色」那一格的标签，展开判定说明。
       收起/展开用 details/summary 实现，不依赖 JS，也不怕被 showDetail 重写丢失。 */
    .role-dd { display: inline-block; }
    /* 「角色」那一格：.d-row 用 justify-content: space-between 两栏布局，
       details 是块级元素会被挤成第二行，让角色行整体靠右 */
    .d-row > .d-role-cell { text-align: right; }
    .role-dd > summary { list-style: none; cursor: pointer; display: inline-flex;
                         align-items: center; gap: 4px; flex-wrap: nowrap; }
    /* summary 的默认 display 是 list-item，只写容器宽会让 ▾ 掉到下一行；
       这里锁住宽度并禁用换行，标签和箭头始终同一行 */
    .role-dd > summary > .role { display: inline-block; }
    .role-dd > summary::-webkit-details-marker { display: none; }
    .role-dd > summary::-moz-list-bullet { list-style: none; }
    .role-dd > summary::after { content: "▾"; font-size: 9px; color: var(--text-subtle);
                                flex-shrink: 0; line-height: 1; }
    .role-dd[open] > summary::after { content: "▴"; }
    .role-panel { position: absolute; right: 16px; z-index: 20; width: 250px; margin-top: 6px;
                  background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px;
                  padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--text-secondary);
                  box-shadow: var(--shadow-md); text-align: left; }
    .role-panel .rp-hd { font-size: 11px; color: var(--text-subtle); letter-spacing: .04em; margin-bottom: 4px; }
    .role-panel .rp-cur { background: var(--bg-surface-2); border-radius: var(--radius-sm); padding: 6px 8px; margin-bottom: 8px; }
    .role-panel ul { list-style: none; }
    .role-panel li { display: flex; gap: 7px; align-items: baseline; padding: 3px 0; }
    .role-panel li .rp-name { flex-shrink: 0; width: 52px; }
    .role-panel li.is-cur { background: var(--blue-50); border-radius: 5px; }
    .role-panel .rp-rule { color: var(--text-muted); font-size: 11px; }
    .role-panel .rp-ft { margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border-color-alt);
                         color: var(--text-subtle); font-size: 11px; }

    /* ---------- 数据质量折叠面板（P0-1）---------- */
    .qdd { margin-top: 6px; }
    .qdd > summary { cursor: pointer; list-style: none; font-size: 11.5px; color: var(--brand);
                     display: inline-flex; align-items: center; gap: 4px; user-select: none; }
    .qdd > summary::-webkit-details-marker { display: none; }
    .qdd > summary::before { content: "▸"; color: var(--text-subtle); }
    .qdd[open] > summary::before { content: "▾"; }
    .qpanel { margin-top: 6px; padding: 9px 11px; background: var(--bg-surface);
              border: 1px solid var(--border-color); border-radius: 8px;
              font-size: 11.5px; line-height: 1.65; color: var(--text-secondary); }
    .qpanel table { border-collapse: collapse; width: 100%; margin-top: 4px; }
    .qpanel th, .qpanel td { text-align: left; padding: 3px 8px 3px 0; vertical-align: top;
                             border-bottom: 1px solid var(--border-color-alt); }
    .qpanel th { color: var(--text-subtle); font-weight: 500; white-space: nowrap; }
    .qpanel td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .qpanel .qh { margin: 9px 0 3px; color: var(--text-primary); font-weight: 600; }
    .qpanel .qh:first-child { margin-top: 0; }

    /* ---------- 关键论文榜：三种独立排序 ---------- */
    .rk-tabs { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .rk-tab { font-size: 12px; padding: 3px 11px; border-radius: var(--radius-pill);
              border: 1px solid var(--border-color); background: var(--bg-surface);
              color: var(--text-secondary); cursor: pointer; line-height: 1.5; }
    .rk-tab:hover { border-color: var(--brand); color: var(--brand); }
    .rk-tab.on { background: var(--brand); border-color: var(--brand); color: var(--text-inverse); }
    .rk-explain { font-size: 11.5px; color: var(--text-muted); margin-bottom: 7px; line-height: 1.55; }

    /* ---------- 聚焦模式工具条（P0-4）---------- */
    #focusBar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
                padding: 7px 18px; background: var(--blue-50, #e8f0fe);
                border-bottom: 1px solid var(--border-color); font-size: 12px; }
    #focusBar[hidden] { display: none; }
    #focusBar .fb-title { color: var(--text-primary); font-weight: 600; min-width: 0;
                          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
    #focusBar .fb-meta { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    #focusBar .spacer { flex: 1; }
    .fb-btn { font-size: 12px; padding: 3px 10px; border-radius: var(--radius-pill);
              border: 1px solid var(--border-color); background: var(--bg-surface);
              color: var(--text-secondary); cursor: pointer; line-height: 1.5; }
    .fb-btn:hover { border-color: var(--brand); color: var(--brand); }
    .fb-btn.on { background: var(--brand); border-color: var(--brand); color: var(--text-inverse); }
    .fb-btn.ghost { background: transparent; }

    /* 详情里的次要按钮（以此论文为中心探索等） */
    .d-act { display: block; width: 100%; margin-top: 8px; text-align: center; font-size: 12.5px;
             padding: 7px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
             background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; }
    .d-act:hover { border-color: var(--brand); color: var(--brand); background: var(--blue-50, #e8f0fe); }
    .d-act.primary { background: var(--brand); border-color: var(--brand); color: var(--text-inverse); }
    .d-act.primary:hover { background: var(--brand-active); color: var(--text-inverse); }

    /* ---------- 库内论文搜索（定位到图上节点）---------- */
    /* 38 个点的力导向图里靠肉眼找某一篇是不现实的，所以给一个按标题定位的入口。
       复用聚焦逻辑：搜索命中 = 居中 + 进入聚焦态 + 打开详情，不另造一套高亮。
       z-index 必须高于 tooltip(9999999)，否则下拉列表会被悬浮提示吃掉。 */
    #gsearch { position: relative; flex-shrink: 0; }
    #gsInput {
      width: 260px; font-size: 12.5px; padding: 5px 26px 5px 10px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
      background: var(--bg-base); color: var(--text-primary); font-family: inherit;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    #gsInput:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
    #gsInput::placeholder { color: var(--text-subtle); }
    #gsClear {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; line-height: 1; border: 0; border-radius: 50%;
      background: var(--bg-muted); color: var(--text-muted); cursor: pointer;
      font-size: 13px; padding: 0;
    }
    #gsClear:hover { background: var(--bg-active); color: var(--text-primary); }
    #gsClear[hidden] { display: none; }
    #gsPanel {
      position: absolute; left: 0; top: calc(100% + 5px); width: 380px; max-height: 340px;
      overflow-y: auto; z-index: 10000001; background: var(--bg-surface);
      border: 1px solid var(--border-color); border-radius: var(--radius-md);
      box-shadow: var(--shadow-pop); padding: 4px;
    }
    #gsPanel[hidden] { display: none; }
    #gsPanel .gs-hd {
      font-size: 11px; color: var(--text-subtle); padding: 4px 10px 6px;
      letter-spacing: .04em;
    }
    #gsPanel .gs-item {
      display: flex; align-items: baseline; gap: 8px; padding: 6px 10px;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 12.5px;
      color: var(--text-secondary); line-height: 1.45;
    }
    #gsPanel .gs-item:hover,
    #gsPanel .gs-item.on { background: var(--bg-brand-soft); color: var(--text-primary); }
    #gsPanel .gs-item b { font-weight: 600; color: var(--brand-text); }
    #gsPanel .gs-item .gs-meta {
      flex-shrink: 0; margin-left: auto; font-size: 11px; color: var(--text-subtle);
      font-variant-numeric: tabular-nums;
    }
    #gsPanel .gs-tip { padding: 8px 10px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    #gsPanel .gs-tip b { color: var(--text-primary); }
  </style>
</head>
<body>
  <header>
    <a class="back" href="index.html">← 返回</a>
    <h1>🕸 论文引用关系图谱</h1>
    <span class="pill" id="pillNodes">节点 <b>–</b></span>
    <span class="pill" id="pillEdges">引用边 <b>–</b></span>
    <span class="pill" id="pillComm">引用关系簇 <b>–</b></span>
    <div id="gsearch">
      <input id="gsInput" type="text" placeholder="搜索库内论文标题…" autocomplete="off"
             spellcheck="false" aria-label="搜索库内论文标题">
      <button id="gsClear" title="清空" hidden>×</button>
      <div id="gsPanel" hidden></div>
    </div>
    <span class="spacer"></span>
    <div id="legend"></div>
  </header>

  <div id="hint">
    点节点看详情，右侧可跳阅读页 ·
    <b>节点大小</b>=PageRank（被有影响力的论文引用，不只是被引得多）·
    <b>颜色</b>=引用关系簇（只反映"被谁引用"，不是研究领域分类）·
    <b>箭头</b>=引用方向
  </div>

  <div id="commNote">
    <span id="commNoteText">引用关系簇正在计算…</span>
    <details class="qdd" id="qDetail">
      <summary>数据与口径</summary>
      <div class="qpanel" id="qPanel"></div>
    </details>
  </div>

  <div id="csBar">
    <div id="csTitle">
      关键论文 Top 10
      <span class="sub">三种指标各自独立排序，切一栏看一栏；<b>综合分只代表网络结构重要性，不是论文质量</b></span>
    </div>
    <div class="rk-tabs" id="rkTabs"></div>
    <div class="rk-explain" id="rkExplain"></div>
    <div id="csList"></div>
  </div>

  <div id="focusBar" hidden>
    <span class="fb-title" id="fbTitle"></span>
    <span class="fb-meta" id="fbMeta"></span>
    <span class="spacer"></span>
    <button class="fb-btn" id="fbAll" title="显示全部直接引用与被引用关系">全部关系</button>
    <button class="fb-btn" id="fbOut" title="只保留：这篇论文引用了谁">仅看它引用的</button>
    <button class="fb-btn" id="fbIn" title="只保留：谁引用了这篇论文">仅看引用它的</button>
    <button class="fb-btn ghost" id="fbExit">退出聚焦</button>
  </div>

  <main>
    <div id="chartWrap">
      <div id="chart"></div>
      <div id="isoBox" hidden></div>
    </div>
    <div id="empty" hidden></div>
    <aside id="detail" hidden></aside>
  </main>

  <details id="reviewBar">
    <summary id="reviewSummary">低置信度匹配（待人工核验）…</summary>
    <div class="rev-wrap" id="reviewList"></div>
  </details>

<script>
// ---------- 常量与工具 ----------
const API = '';  // 同源部署：页面挂在 /ui/，接口在根路径

/* 社区配色：顺序固定 c1..c10，同一篇论文在两次渲染里必须同色。
   色值来自 design-system.css 的 --chart-c1..c10（ECharts 不认 var()，
   只能用 ChartColors 把计算值读出来）。读不到时退回兜底值，
   与改造前的 COMM_COLORS 完全一致，所以最坏情况只是"没联动"，不会变形。 */
function communityColors() {
  return ChartColors.communityPalette(ChartColors.read());
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// 边是怎么连起来的：三种命中方式 + 各自的可信度说明。
// 写成人话而不是 match_method 原始值——原始值是给代码看的，不是给评委看的。
const MATCH_LABEL = {
  arxiv: 'arXiv 号精确命中',
  title_exact: '标题逐字相同',
  title_fuzzy: '标题近似（相似度 ≥ 0.92）',
};

let chart = null;
let allNodes = [];
let allEdges = [];
let nodeById = new Map();

// ---------- 启动 ----------
async function boot() {
  let data;
  try {
    const resp = await fetch(`${API}/graph`, { headers: { Accept: 'application/json' } });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (e) {
    showEmpty(`接口请求失败：${esc(e.message)}<br/>确认服务在运行，且已经访问过 <code>/health</code>。`);
    return;
  }
  if (!data.ready) {
    showEmpty(`${esc(data.detail || '图谱还没生成')}<br/><br/>在项目根目录运行：<code>python scripts/build_graph.py</code>`);
    return;
  }
  render(data);
}

function showEmpty(html) {
  const el = $('empty');
  el.hidden = false;
  el.innerHTML = `<div style="text-align:center;line-height:1.9">${html}</div>`;
  $('chart').style.display = 'none';
}

// ---------- 渲染 ----------
function render(data) {
  allNodes = data.nodes || [];
  allEdges = data.edges || [];
  nodeById = new Map(allNodes.map(n => [n.id, n]));
  const sum = data.summary || {};

  $('pillNodes').innerHTML = `节点 <b>${allNodes.length}</b>`;
  $('pillEdges').innerHTML = `引用边 <b>${allEdges.length}</b>`;
  $('pillComm').innerHTML = `引用关系簇 <b>${sum.community_count || 0}</b>`;

  renderLegend(sum);
  renderQuality(sum);
  renderRankings(data);

  // 常驻标签只给"图上真正重要"的节点：当前榜单 Top 6 + 每个簇最大的一个。
  // 全挂标签会被 hideOverlap 随机藏掉一部分，看起来毫无规律。
  LABEL_ALWAYS.clear();
  const curRank = ((data.key_papers || {}).rankings || [])
    .find(r => r.key === rankKey) || { rows: [] };
  curRank.rows.slice(0, 6).forEach(r => LABEL_ALWAYS.add(r.id));
  const byComm = new Map();
  allNodes.filter(n => !n.isolated).forEach(n => {
    const prev = byComm.get(n.community);
    if (!prev || n.pagerank > prev.pagerank) byComm.set(n.community, n);
  });
  byComm.forEach(n => LABEL_ALWAYS.add(n.id));

  // 孤立节点不放图里（力导向图里孤点会飘到角落被误认为渲染错误），单独统计
  const linked = allNodes.filter(n => !n.isolated);
  const iso = allNodes.filter(n => n.isolated);

  // 节点大小 = PageRank 分位（P0-5）。旧口径是「被引次数」，会和"关键论文榜"的
  // PageRank 排序打架：图上看到的个头和榜上的名次不是一回事，读者会以为有两套结论。
  // 现在全站统一到自己算的一致性映射，见 prSize()。
  chart = echarts.init($('chart'));
  // ECharts 不认 CSS 变量，只能先读出计算值再喂给它；读不到时 ChartColors 用兜底值
  const C = ChartColors.read();
  const COMMS = ChartColors.communityPalette(C);
  const opt = {
    backgroundColor: C.bgPage,
    tooltip: {
      trigger: 'item',
      confine: true,
      formatter: (p) => {
        if (p.dataType === 'edge') {
          const e = p.data;
          const s = nodeById.get(e.source) || {};
          const t = nodeById.get(e.target) || {};
          return `<b>${esc(s.title || e.source)}</b><br/>` +
                 `<span style="color:${C.textMuted}">引用 ↓</span><br/>` +
                 `<b>${esc(t.title || e.target)}</b>` +
                 `<br/><span style="color:${C.textSubtle};font-size:11px">匹配方式：${esc(e.match_method)}` +
                 `${MATCH_LABEL[e.match_method] ? '（' + MATCH_LABEL[e.match_method] + '）' : ''}</span>`;
        }
        const d = p.data.meta;
        return `<b>${esc(d.title)}</b><br/>` +
               `PageRank：${d.pagerank.toFixed(4)}（分位 ${(d.pagerank_pct || 0).toFixed(2)}）<br/>` +
               `被库内引用：${d.cited_by} 篇<br/>` +
               `引用了库内：${d.cites} 篇<br/>` +
               `中介中心性：${(d.betweenness || 0).toFixed(3)}<br/>` +
               `<span style="color:${C.textSubtle};font-size:11px">点击看详情 · 再点一次收起</span>`;
      },
    },
    series: [{
      type: 'graph',
      layout: 'force',
      roam: true,
      draggable: true,
      // zoom 留 1，等 force 模拟收敛后由 fitGraph() 按实际点集自适应，
      // 因为力导向每次初始位置随机，写死 zoom 会时大时小、偶尔溢出画布
      zoom: 1,
      textStyle: { fontSize: 10, color: C.textSecondary },
      symbolSize: (val, p) => prSize(p.data.meta),
      label: {
        // 只有重点论文常驻标签，其余靠悬停（P0-5）。
        // 38 个点全挂标签时重叠严重，labelLayout.hideOverlap 会随机藏掉一部分，
        // 于是"哪些有名字"看起来毫无规律——反而不如明确只给重点节点。
        show: false,
        position: 'right',
        fontSize: 10,
        color: C.textSecondary,
        formatter: (p) => truncate(p.data.meta.title, 24),
      },
      labelLayout: { hideOverlap: true },
      itemStyle: {
        borderWidth: 2,
        borderColor: 'rgba(255,255,255,.9)',
        shadowBlur: 6,
        shadowColor: 'rgba(0,0,0,.12)',
      },
      emphasis: {
        // focus 交给 focusRelated() 自己做：ECharts 的 'adjacency' 只解决"点亮邻居"，
        // 没办法把"无关节点弱化到几乎看不见"，而 P0 要的正是后者。
        focus: 'none',
        label: { show: true, fontSize: 12, fontWeight: 'bold' },
      },
      lineStyle: { color: 'source', curveness: 0.12, opacity: 0.28, width: 1 },
      force: {
        // 38 个节点、210 条边，密度很高；repulsion 偏小会让中心糊成一团，
        // 偏大会让整图缩成一小点，边短一点能把密集区拉开（相连的才挤）
        repulsion: 900,
        edgeLength: [130, 260],
        gravity: 0.035,
        friction: 0.55,
        // force 的布局动画会让节点在适配之后继续移动，导致刚算好的 zoom 失效
      // （实测适配后仍有 1~3 个点飘出画布）。所以先关掉动画、等它彻底停住，
      // 做一次适配后再把动画打开，这样用户后续拖拽仍然是流畅的。
      layoutAnimation: false,
      },
      edgeSymbol: ['none', 'arrow'],
      edgeSymbolSize: 6,
      data: linked.map((n) => ({
        id: n.id,
        name: n.title,
        meta: n,
        itemStyle: { color: COMMS[n.community % COMMS.length] },
        label: { show: LABEL_ALWAYS.has(n.id) },
      })),
      links: allEdges
        .filter(e => nodeById.has(e.source) && nodeById.has(e.target) && e.source !== e.target)
        .map(e => ({
          source: e.source,
          target: e.target,
          match_method: e.match_method,
          lineStyle: { color: COMMS[(nodeById.get(e.source).community) % COMMS.length] },
        })),
    }],
  };
  chart.setOption(opt);
  //
  // 这里必须处理"命中边"的情况：图里 35 个点却有 189 条边，边会压在节点圆点上，
  // 而 ECharts 的命中优先级里边高于节点。实测点 Attention 的圆心，回调拿到的却是
  // dataType='edge'、name='arxiv:2107.03374 > arxiv:1706.03762'，于是旧代码里
  // `p.dataType === 'node'` 直接跳过——这才是"点节点打不开"的真实原因。
  // 处理办法：命中边时顺着边的两端找节点，取离鼠标更近的那个展示。
  const pickNodeFromEvent = (p) => {
    if (!p) return null;
    if (p.dataType === 'node' && p.data && p.data.meta) return p.data.meta;
    if (p.dataType === 'edge') {
      // ECharts 的 edge data 只有 source/target，元数据要从 nodeById 反查
      const d = p.data || {};
      const s = nodeById.get(d.source);
      const t = nodeById.get(d.target);
      if (s && t) {
        // event.offsetX/offsetY 是画布内坐标；算出两端点屏幕位置取近者
        const ev = p.event || {};
        const ox = ev.offsetX, oy = ev.offsetY;
        if (typeof ox === 'number' && typeof oy === 'number') {
          const dist = (n) => {
            const px = chart.convertToPixel({ seriesIndex: 0 }, [n.x, n.y]);
            if (!px) return Infinity;
            return (px[0] - ox) ** 2 + (px[1] - oy) ** 2;
          };
          return dist(s) <= dist(t) ? s : t;
        }
        return s;
      }
      if (s) return s;
      if (t) return t;
    }
    return null;
  };

  const onPick = (p) => {
    const n = pickNodeFromEvent(p);
    if (!n) return;
    try {
      if (detailId === n.id) { hideDetail(); exitFocus(); return; }
      showDetail(n);
      // 点节点即进入聚焦（P0-4）：一阶邻居高亮、无关节点弱化。
      // 只高亮不弱化的话，38 个点里"哪些相关"照样看不出来——真正的可读性来自压暗其余部分。
      enterFocus(n.id);
    } catch (err) {
      console.error('[graph] 打开详情失败', err);
      alert('打开详情失败：' + (err && err.message ? err.message : err));
    }
  };
  chart.on('click', onPick);
  // 拖拽节点时不会触发 click，松手补一次，保证"拖出来再点"也能打开
  chart.on('pointEnd', onPick);
  window.addEventListener('resize', () => { chart && chart.resize(); });

  // 聚焦工具条：方向切换与退出（P0-4）
  $('fbAll').addEventListener('click', () => { focusDir = 'all'; applyFocus(); });
  $('fbOut').addEventListener('click', () => { focusDir = 'out'; applyFocus(); });
  $('fbIn').addEventListener('click', () => { focusDir = 'in'; applyFocus(); });
  $('fbExit').addEventListener('click', () => { exitFocus(); hideDetail(); });

  // 库内论文搜索（定位到图上节点）
  bindSearch();

  // 力导向跑完再自适应缩放。ECharts 的 graph center 是"视口对准哪个数据坐标"，
  // 不是自动居中，所以必须自己算出点集中心再 dispatchAction。
  //
  // 坑位记录：
  // 1. 坐标系统字段名是 transform，不是 _transform；取 _transform 永远是空数组，
  //    回退成单位矩阵后一切"看起来正常"，但实际缩放位移没生效。
  // 2. graphRoam 的 zoom 是相对当前值的倍率，dx/dy 是屏幕像素位移。
  // 3. Math.max(...arr) 在点数上千时会爆栈，这里手写循环求极值。
  const fitGraph = () => {
    if (!chart) return;
    const seriesModel = chart.getModel().getSeriesByIndex(0);
    const cs = seriesModel.coordinateSystem;
    if (!cs) return;                        // force 首帧还没建坐标系统
    const data = seriesModel.getData();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, n = 0;
    for (let k = 0; k < data.count(); k++) {
      const L = data.getItemLayout(k);
      if (!L) continue;
      n++;
      if (L[0] < minX) minX = L[0];
      if (L[0] > maxX) maxX = L[0];
      if (L[1] < minY) minY = L[1];
      if (L[1] > maxY) maxY = L[1];
    }
    if (!n) return;
    const spanX = (maxX - minX) || 1;
    const spanY = (maxY - minY) || 1;
    const W = chart.getWidth();
    const H = chart.getHeight();
    // 边距要同时容下：节点半径最大约 38px、右侧标签最长约 150px。
    // 只用 86% 算 width 时，标签会把最右侧的点挤出画布（实测底边溢出 10px），
    // 所以 horizontally 再让一点，vertical 只留节点半径。
    const target = Math.min((W - 340) / spanX, (H - 90) / spanY);
    if (!isFinite(target) || target <= 0) return;

    // 关键：不用 graphRoam。它的 dx/dy 与 zoom 的组合语义不稳定，
    // 实测缩放和位移互相干扰，算出来的中心总偏。直接写 series 的
    // zoom/center —— center 就是"视口中心对准的那个数据坐标"，
    // 设成点集的几何中心，ECharts 自己就会把它摆到画布正中。
    chart.setOption({
      series: [{
        zoom: target,
        center: [(minX + maxX) / 2, (minY + maxY) / 2],
      }],
    });
  };
  // force 的 layoutAnimation 约 1s 收敛，但节点会持续微调，
      // 只在某个时刻量一次总会量到"还在动"的位置（实测 zoom 算对了仍有节点越界）。
      // 改成轮询：等极值连续两次不变（真的停了）再适配。
  let lastSig = '';
  let stable = 0;
  const waitStill = () => {
    if (!chart) return;
    const sm = chart.getModel().getSeriesByIndex(0);
    const data = sm && sm.getData();
    if (!data) return schedule();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < data.count(); i++) {
      const L = data.getItemLayout(i);
      if (!L) continue;
      if (L[0] < minX) minX = L[0];
      if (L[0] > maxX) maxX = L[0];
      if (L[1] < minY) minY = L[1];
      if (L[1] > maxY) maxY = L[1];
    }
    const sig = [minX, maxX, minY, maxY].map(v => Math.round(v)).join(',');
    if (sig === lastSig) {
      stable++;
    } else {
      lastSig = sig;
      stable = 0;
    }
    if (stable >= 2) {
      fitGraph();
      // 适配完成后再放行交互时的动画（不影响已算好的位置，只是拖拽更顺）
      return;
    }
    schedule();
  };
  const schedule = () => { if (tries++ < 40) setTimeout(waitStill, 300); };
  let tries = 0;
  setTimeout(waitStill, 1200);

  if (iso.length) {
    // 孤立论文不再删：放进右下角独立小框，与主图区隔。
    // 之前这里只写一行"已从图中省略"，而顶部引用关系簇统计照旧把簇 3 算作 1 篇，
    // 于是画面和数字对不上——现在点进去一样能看详情。
    $('isoBox').innerHTML =
      `<div class="iso-hd">孤立论文（与库内其它论文无引用往来）</div>` +
      iso.map(n => `<a href="#" data-iso="${esc(n.id)}">` +
        `<span class="iso-dot"></span>` +
        `<span>${esc(truncate(n.title, 26))}</span>` +
        `<span class="iso-tag">孤立</span></a>`).join('');
    $('isoBox').hidden = false;
    $('isoBox').querySelectorAll('a[data-iso]').forEach(a => {
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        const n = nodeById.get(a.dataset.iso);
        if (!n) return;
        try { showDetail(n); } catch (err) { console.error('[graph] 孤立节点详情失败', err); }
      });
    });
  }

  renderReviews(data);
}

function truncate(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function renderLegend(sum) {
  const comms = sum.communities || [];
  const COMMS = ChartColors.communityPalette(ChartColors.read());
  $('legend').innerHTML = comms.map(c => `
    <span class="legend-item">
      <span class="legend-dot" style="background:${COMMS[c.id % COMMS.length]}"></span>
      引用关系簇 ${c.id + 1}（${c.size}）
    </span>`).join('');
}

// ---------- 基石节点榜 ----------
const ROLE_LABEL = {
  cornerstone: '基石',
  hub: '高被引',
  bridge: '桥接',
  foundation: '基础件',
  fringe: '边缘',
  isolated: '孤立',
};
const ROLE_TIP = {
  cornerstone: '入度和桥接度都很高：既是这个方向的地基，又是不同方向之间的连接点',
  hub: '被库内大量论文引用，但主要局限在自己所属的引用关系簇内部',
  bridge: '中介中心性高：不同研究方向的论文靠它连在一起',
  foundation: 'PageRank 极高但直接引用不多：典型是通用方法论文，被"被别人引用的论文"反复引用',
  fringe: '在库内很少被引用：属于新工作或尚未被本库覆盖的方向',
  isolated: '与库内其它论文没有任何引用往来',
};

// 角色判定口径（与 app/graph.py 的 cornerstone_scores() 保持一致）。
// 阈值是"全库分位"，不是绝对篇数：0.75 大致相当于排在库内前 25%。
const ROLE_RULE = {
  cornerstone: '被引分位 ≥ 0.75 且 桥接分位 ≥ 0.75',
  hub: '被引分位 ≥ 0.75，但桥接分位 < 0.75',
  bridge: '桥接分位 ≥ 0.75，但被引分位 < 0.75',
  foundation: 'PageRank 分位 ≥ 0.90，且被引、桥接都 < 0.75',
  fringe: '以上四个条件都不满足',
  isolated: '与库内任何论文都没有引用往来，不参与排名',
};

function rolePanelHTML(cur) {
  const order = ['cornerstone', 'hub', 'bridge', 'foundation', 'fringe', 'isolated'];
  const rows = order.map(r => `
    <li class="${r === cur ? 'is-cur' : ''}" title="${esc(ROLE_TIP[r])}">
      <span class="rp-name"><span class="role role-${r}">${esc(ROLE_LABEL[r])}</span></span>
      <span class="rp-rule">${esc(ROLE_RULE[r])}</span>
    </li>`).join('');
  return `
    <div class="rp-hd">角色判定（按全库排名分位）</div>
    <div class="rp-cur"><b>${esc(ROLE_LABEL[cur] || cur)}</b>：${esc(ROLE_TIP[cur] || '')}</div>
    <ul>${rows}</ul>
    <div class="rp-ft">基石分 = 入度分位 × 0.45 + PageRank 分位 × 0.40 + 桥接分位 × 0.15；
      分位指该指标在全库的排名位置（1.0 = 第一）。</div>`;
}

function renderCornerstones(data) {
  const list = (data.cornerstones || []).slice(0, 10);
  if (!list.length) {
    $('csBar').style.display = 'none';
    return;
  }
  $('csList').innerHTML = list.map(c => `
    <div class="cs-row" data-goto="${esc(c.id)}" title="${esc(ROLE_TIP[c.role] || '')}">
      <span class="cs-rank">${c.rank}</span>
      <span class="cs-score">${c.score.toFixed(3)}</span>
      <span class="cs-name">${esc(c.title)}</span>
      <span class="role role-${esc(c.role)}">${esc(ROLE_LABEL[c.role] || c.role)}</span>
    </div>`).join('');

  $('csList').querySelectorAll('.cs-row').forEach(row => {
    row.addEventListener('click', () => {
      const n = nodeById.get(row.dataset.goto);
      if (!n) return;
      showDetail(n);
      // 图上同步高亮，否则点了榜单一栏看不出对应哪个点
      if (chart && !n.isolated) {
        chart.dispatchAction({ type: 'highlight', seriesIndex: 0, name: n.title });
      }
    });
  });
}

// ---------- 关键论文榜：三种指标各自独立排序（P0-3）----------
// 不合并成一个综合分：被引最多、PageRank 最高、桥接最强往往是不同的论文，
// 揉成一个数会把这三条结论都藏起来。切换标签 = 换一个解释角度。
let rankKey = '';

function renderRankings(data) {
  const kp = data.key_papers || {};
  const rankings = kp.rankings || [];
  if (!rankings.length) {
    $('csBar').style.display = 'none';
    return;
  }
  if (!rankKey || !rankings.some(r => r.key === rankKey)) rankKey = rankings[0].key;

  $('rkTabs').innerHTML = rankings.map(r =>
    `<button class="rk-tab${r.key === rankKey ? ' on' : ''}" data-rk="${esc(r.key)}">${esc(r.title)}</button>`
  ).join('');
  $('rkTabs').querySelectorAll('.rk-tab').forEach(btn => {
    btn.addEventListener('click', () => { rankKey = btn.dataset.rk; renderRankings(data); });
  });

  const cur = rankings.find(r => r.key === rankKey);
  const maxV = Math.max(...cur.rows.map(r => Number(r.value) || 0), 1e-9);
  $('rkExplain').innerHTML = `${esc(cur.explain)}
    <span style="color:var(--text-subtle)">按<b>${esc(cur.title)}</b>降序，只统计有引用往来的 ${cur.rows.length >= 10 ? 'Top 10' : cur.rows.length + ' 篇'}。</span>`;

  $('csList').innerHTML = cur.rows.map(r => {
    const v = Number(r.value) || 0;
    const shown = cur.key === 'pagerank' ? v.toFixed(4)
      : cur.key === 'betweenness' ? v.toFixed(4) : String(v);
    const width = Math.max(4, Math.round(v / maxV * 100));
    return `
    <div class="cs-row at-${esc(cur.key)}" data-goto="${esc(r.id)}"
         title="${esc(r.title)} —— ${esc(cur.title)} = ${esc(shown)}${esc(cur.unit)}">
      <span class="cs-rank">${r.rank}</span>
      <span class="cs-score">${esc(shown)}</span>
      <span class="cs-name">${esc(r.title)}</span>
      <span class="rk-bar"><i style="width:${width}%"></i></span>
    </div>`;
  }).join('');

  $('csList').querySelectorAll('.cs-row').forEach(row => {
    row.addEventListener('click', () => {
      const n = nodeById.get(row.dataset.goto);
      if (!n) return;
      showDetail(n);
      enterFocus(n.id);
    });
  });
}

// ---------- 数据与口径面板（P0-1）----------

// 数据一更新就对不上，评委一眼能看出"文档和系统不一致"。
function renderQuality(sum) {

  const cq = sum.community_q || {};
  const comms = sum.communities || [];

  const fmt = (v, k) => (Number(v) || 0).toFixed(k == null ? 0 : k);

    <div class="qh">这张图是怎么来的</div>

    </table>

    <div class="qh">引用关系簇的统计检验</div>
    <table>
      <tr><th>实测模块度 Q</th><td class="n">${fmt(cq.real, 6)}</td></tr>
      <tr><th>随机图 Q 均值</th><td class="n">${fmt(cq.mean, 6)}</td></tr>
      <tr><th>随机图 Q 中位数区间</th><td class="n">${fmt(cq.min, 6)} ~ ${fmt(cq.max, 6)}</td></tr>
      <tr><th>随机图 Q 95 分位</th><td class="n">${fmt(cq.p95, 6)}</td></tr>
      <tr><th>实际超过随机图</th><td class="n">${cq.beaten != null ? cq.beaten + ' / ' + cq.rounds : '—'}</td></tr>
      <tr><th>随机化协议</th><td>被引方不动，<b>引用方洗牌</b>（保留每个节点的出度与全图被引次数，只打散「谁引了谁」）；随机种子 ${fmt(cq.seed)}，可复现</td></tr>
    </table>
    <div style="margin-top:4px;color:var(--text-subtle)">

      只说明「按引用关系切出来的这些簇，不是天然分明的学科边界」——所以全站只叫「引用关系簇」。

      <tr><td style="padding-left:14px;color:var(--text-subtle)">· arXiv 号库里没有且无同标题</td><td class="n">${q.review_arxiv_absent || 0}</td></tr>

// ---------- 聚焦：一阶邻居高亮 + 无关节点弱化（P0-4）----------
// 为什么不用 ECharts 的 emphasis.focus:'adjacency'：
//   它只能"点亮"邻居，剩下的节点照样是不透明的一团，38 个点里根本分不出哪些相关。
//   这里改成主动改每个节点的 itemStyle.opacity —— 谁来当"亮"，由我们决定。
let focusId = null;
let focusDir = 'all';        // all | out（仅它引用的）| in（仅引用它的）
let baseData = [];           // 未弱化时的 data 原样，退出聚焦时还原
const LABEL_ALWAYS = new Set();

function linkedIds() {
  return allNodes.filter(n => !n.isolated).map(n => n.id);
}

// PageRank → 像素半径：28..58，用分位而不是原值，避免单个 0.178 把其余压成一样大
function prSize(n) {
  const pct = Number(n && n.pagerank_pct != null ? n.pagerank_pct : 0);
  return 28 + Math.max(0, Math.min(1, pct)) * 30;
}

function relatedSet(id, dir) {
  const out = new Set();
  allEdges.forEach(e => {
    if (dir !== 'in' && e.source === id && nodeById.has(e.target)) out.add(e.target);
    if (dir !== 'out' && e.target === id && nodeById.has(e.source)) out.add(e.source);
  });
  return out;
}

function focusStat(id, dir) {
  let nIn = 0, nOut = 0;
  allEdges.forEach(e => {
    if (e.target === id) nIn++;
    if (e.source === id) nOut++;
  });
  return { in: nIn, out: nOut, dir };
}

function enterFocus(id, dir) {
  if (!chart || !nodeById.has(id)) return;
  const n = nodeById.get(id);
  if (n.isolated) {                    // 孤立点没有邻居，聚焦无意义，只给详情
    exitFocus();
    return;
  }
  focusId = id;
  focusDir = dir || 'all';
  applyFocus();
}

function applyFocus() {
  if (!chart || !focusId) return;
  // 第一次进入时把原始 data 存下来；之后每次切换方向都从原始值重建，
  // 否则来回切几次会把 opacity 越乘越低（经典的状态叠加 bug）
  if (!baseData.length) baseData = chart.getOption().series[0].data;

  const keep = relatedSet(focusId, focusDir);
  keep.add(focusId);
  const C = ChartColors.read();
  const COMMS = ChartColors.communityPalette(C);
  const isOn = (id) => keep.has(id);
  // 聚焦时标签只给「聚焦点 + 它的一阶邻居里 PageRank 最高的 8 个」。
  // 全开会让 20 多个标签挤在中心糊成一片（实测截图里 "BERT: Pre-training of…"
  // 直接压在 "Attention Is All You Need" 上），而 labels 全开也不解决"看谁"——
  // 真正要读的是中心那篇和几个主要邻居；其余仍可靠悬停看。
  const focusLabels = new Set([focusId]);
  const nbrs = [...keep].filter((id) => id !== focusId)
    .map((id) => nodeById.get(id) || {})
    .sort((a, b) => (b.pagerank || 0) - (a.pagerank || 0));
  nbrs.slice(0, 8).forEach((n) => focusLabels.add(n.id));

  const data = baseData.map(d => {
    const on = isOn(d.id);
    const n = nodeById.get(d.id) || {};
    return Object.assign({}, d, {
      itemStyle: {
        color: COMMS[(n.community || 0) % COMMS.length],
        opacity: on ? 1 : 0.12,
        borderColor: on ? (d.id === focusId ? C.chartRing : 'rgba(255,255,255,.9)') : 'rgba(255,255,255,.5)',
        borderWidth: d.id === focusId ? 4 : 2,
      },
      // 聚焦点永远显标签；邻居只给前 8 个；被压暗的一律不显
      label: { show: focusLabels.has(d.id) },
    });
  });

  const links = chart.getOption().series[0].links.map(L => {
    const hot = L.source === focusId || L.target === focusId;
    const keepEdge = hot && (focusDir === 'all' ||
      (focusDir === 'out' && L.source === focusId) ||
      (focusDir === 'in' && L.target === focusId));
    const srcComm = (nodeById.get(L.source) || {}).community || 0;
    return Object.assign({}, L, {
      lineStyle: {
        color: COMMS[srcComm % COMMS.length],
        opacity: keepEdge ? 0.85 : 0.05,
        width: keepEdge ? 2 : 0.6,
        curveness: 0.12,
      },
    });
  });

  chart.setOption({ series: [{ data, links }] });

  // 工具条
  const st = focusStat(focusId, focusDir);
  $('fbTitle').textContent = nodeById.get(focusId).title;
  $('fbTitle').title = $('fbTitle').textContent;
  $('fbMeta').textContent = `一阶邻居 ${st.in + st.out} 篇（被它引用 ${st.out} · 引用它 ${st.in}）`;
  $('fbAll').classList.toggle('on', focusDir === 'all');
  $('fbOut').classList.toggle('on', focusDir === 'out');
  $('fbIn').classList.toggle('on', focusDir === 'in');
  $('focusBar').hidden = false;
  // 工具条一出现就把 #chartWrap 往下挤了 41px，容器变矮，但 ECharts 不会自己知道
  // （它只在 window resize 时重算）。不补这一下，画布仍按旧高度渲染，底部 41px
  // 溢出到容器外，点击坐标和看到的节点就错位了。
  chart.resize();
}

function exitFocus() {
  if (!chart) return;
  const wasFocused = !!focusId;
  focusId = null;
  focusDir = 'all';
  if (baseData.length) {
    chart.setOption({ series: [{ data: baseData }] });
    baseData = [];
  }
  // 只还原 opacity，连线恢复默认样式，避免"退出后还留着一半暗掉的边"
  if (wasFocused) {
    const C = ChartColors.read();
    const COMMS = ChartColors.communityPalette(C);
    const links = chart.getOption().series[0].links.map(L => {
      const srcComm = (nodeById.get(L.source) || {}).community || 0;
      return Object.assign({}, L, {
        lineStyle: { color: COMMS[srcComm % COMMS.length], opacity: 0.28, width: 1, curveness: 0.12 },
      });
    });
    chart.setOption({ series: [{ links }] });
  }
  $('focusBar').hidden = true;
  // 同上：工具条收起后容器变高，画布要跟着长回去
  chart.resize();
}

// ---------- 库内论文搜索：按标题定位到图上节点 ----------
// 设计取舍：
// 1. 只搜标题 —— 用户记得的多半是标题片段，摘要/正文要走 RAG，响应时间和依赖都上一个量级。
// 2. 命中后不做另一套高亮，直接复用 enterFocus + showDetail：搜索和点击必须是同一个状态机，
//    否则"搜出来的"和"点上"的两种态会互相打架（一个压暗了另一个没压）。
// 3. 孤立论文也在可搜范围里（它们在 allNodes 里，isolation 只标记不入图），
//    但跳过去只能打开详情 —— 图上根本没有那个点，硬跳视口会飞到空白处。
const GS_MAX = 20;

let gsItems = [];        // 当前命中项
let gsActive = -1;       // 键盘高亮的序号

function gsNorm(s) {
  return String(s == null ? '' : s).trim().toLowerCase();
}

function gsSearch(q) {
  const kw = gsNorm(q);
  if (!kw) return [];
  // 子串匹配即可：库内只有 38 篇，不需要分词，也没有性能压力。
  // 排序：标题开头命中的排前面，其次按 PageRank（重要论文先出现）。
  const hits = allNodes.filter(n => gsNorm(n.title).includes(kw));
  hits.sort((a, b) => {
    const aHead = gsNorm(a.title).startsWith(kw) ? 0 : 1;
    const bHead = gsNorm(b.title).startsWith(kw) ? 0 : 1;
    if (aHead !== bHead) return aHead - bHead;
    return (b.pagerank || 0) - (a.pagerank || 0);
  });
  return hits.slice(0, GS_MAX);
}

// 把标题里命中的片段包成 <b>，其余部分转义 —— 顺序不能反，先转义再插标签
function gsHighlight(title, q) {
  const raw = String(title == null ? '' : title);
  const kw = gsNorm(q);
  const low = raw.toLowerCase();
  const at = low.indexOf(kw);
  if (at < 0) return esc(raw);
  return esc(raw.slice(0, at)) + '<b>' + esc(raw.slice(at, at + kw.length)) + '</b>' +
         esc(raw.slice(at + kw.length));
}

function gsRender(q) {
  const panel = $('gsPanel');
  const kw = String(q == null ? '' : q).trim();
  if (!kw) { gsClose(); return; }

  gsItems = gsSearch(kw);
  gsActive = gsItems.length ? 0 : -1;

  if (!gsItems.length) {
    const total = allNodes.length;
    const iso = allNodes.filter(n => n.isolated).length;
    panel.innerHTML =
      `<div class="gs-tip"><b>图谱中无此论文</b>：没有标题包含「${esc(kw)}」。<br/>` +
      `当前图谱只含 <b>${total}</b> 篇有引用关系的论文` +
      (iso ? `（另有 ${iso} 篇入库但没有任何引用关系，也未画进图中）` : '') +
      `；论文库里没入库的文献不在搜索范围内。</div>`;
    panel.hidden = false;
    return;
  }

  panel.innerHTML =
    `<div class="gs-hd">命中 ${gsItems.length} 篇${gsItems.length >= GS_MAX ? `（只显示前 ${GS_MAX} 篇）` : ''} · 回车定位第一篇</div>` +
    gsItems.map((n, i) => `
      <div class="gs-item${i === gsActive ? ' on' : ''}" data-i="${i}" title="${esc(n.title)}">
        <span>${gsHighlight(n.title, kw)}</span>
        <span class="gs-meta">${n.isolated ? '无引用关系' : '被引 ' + (n.cited_by || 0)}</span>
      </div>`).join('');
  panel.hidden = false;
  panel.querySelectorAll('.gs-item').forEach(el => {
    el.addEventListener('mousedown', (ev) => {
      // mousedown 而不是 click：click 前 input 会先 blur，blur 里我们会关面板
      ev.preventDefault();
      gsGoto(Number(el.dataset.i));
    });
  });
}

function gsClose() {
  $('gsPanel').hidden = true;
  $('gsPanel').innerHTML = '';
  gsItems = [];
  gsActive = -1;
}

function gsMarkActive() {
  $('gsPanel').querySelectorAll('.gs-item').forEach((el, i) => {
    el.classList.toggle('on', i === gsActive);
  });
  const on = $('gsPanel').querySelector('.gs-item.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

// 跳转到某条命中：居中 + 聚焦 + 打开详情
function gsGoto(i) {
  const n = gsItems[i];
  if (!n) return;
  gsClose();
  $('gsInput').blur();

  if (n.isolated) {
    // 孤立论文不在图上，只能给详情，并明确告诉用户为什么没有点
    showDetail(n);
    $('commNoteText').innerHTML =
      `<b>「${esc(n.title)}」没有引用关系</b>，不在主图中显示，右侧是它的详情。`;
    return;
  }

  showDetail(n);
  enterFocus(n.id, 'all');
  const pos = nodePos(n.id);
  if (pos && chart) chart.setOption({ series: [{ zoom: 1.35, center: pos }] });
  $('fbTitle').textContent = n.title;
  $('fbTitle').title = n.title;
}

function bindSearch() {
  const inp = $('gsInput');
  const panel = $('gsPanel');
  const clr = $('gsClear');

  inp.addEventListener('input', () => {
    clr.hidden = !inp.value;
    gsRender(inp.value);
  });

  inp.addEventListener('focus', () => {
    if (inp.value.trim()) gsRender(inp.value);
  });

  inp.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') {
      if (!gsItems.length) return;
      ev.preventDefault();
      gsActive = (gsActive + 1) % gsItems.length;
      gsMarkActive();
    } else if (ev.key === 'ArrowUp') {
      if (!gsItems.length) return;
      ev.preventDefault();
      gsActive = (gsActive - 1 + gsItems.length) % gsItems.length;
      gsMarkActive();
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (gsItems.length) gsGoto(gsActive < 0 ? 0 : gsActive);
      else if (inp.value.trim()) gsRender(inp.value);   // 让"无此论文"提示稳定可见
    } else if (ev.key === 'Escape') {
      gsClose();
      inp.blur();
    }
  });

  clr.addEventListener('click', () => {
    inp.value = '';
    clr.hidden = true;
    gsClose();
    inp.focus();
  });

  // 点面板外部收起。用 mousedown 捕获阶段，避免和面板内 mousedown 抢顺序
  document.addEventListener('mousedown', (ev) => {
    if (!$('gsearch').contains(ev.target)) gsClose();
  });

  // 输入框失焦也收起，但给一个极短延迟：面板项的 mousedown 已 preventDefault，
  // 正常不会丢；这里兜底处理"点浏览器其它区域"。
  inp.addEventListener('blur', () => {
    setTimeout(() => {
      if (!panel.matches(':hover')) gsClose();
    }, 120);
  });
}

// ---------- 右侧详情 ----------
// 当前右栏展示的节点 id，null 表示未展开。点击逻辑用它做 toggle。
let detailId = null;

function hideDetail() {
  const aside = $('detail');
  aside.hidden = true;
  aside.innerHTML = '';
  detailId = null;
  if (chart) chart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
}

// 「以此论文为中心探索」：把这篇论文放回图中心、只留一阶邻居（P0-6）。
// 与"点击聚焦"的区别：这个是从详情按钮主动发起，会把视口对准它；
// 点节点聚焦不改视口，因为用户刚从那一点点的，视野里本来就有它。
// ⚠ 中心坐标必须从**渲染后的 series.data** 里取：nodeById 里的是后端返回的纯数据，
// 没有 x/y（那是 ECharts 力导向自己算出来的），直接读 n.x 会得到 undefined →
// center:[undefined,undefined] → 视口跳到原点，看起来就像"按钮没反应"。
function nodePos(id) {
  if (!chart) return null;
  const arr = (chart.getOption().series[0] || {}).data || [];
  const hit = arr.find(d => d.id === id);
  if (hit && typeof hit.x === 'number' && typeof hit.y === 'number') return [hit.x, hit.y];
  return null;
}

function exploreCenter(id) {
  const n = nodeById.get(id);
  if (!n) return;
  enterFocus(id, 'all');
  if (!chart || n.isolated) return;
  const pos = nodePos(id);
  if (pos) chart.setOption({ series: [{ zoom: 1.35, center: pos }] });
  $('fbTitle').textContent = '以「' + n.title + '」为中心';
  $('fbTitle').title = n.title;
}

function showDetail(n) {
  if (!n) return;
  // 右栏原本是 position:static，绝对定位的关闭按钮会跑到视口右上角。
  // 现在 aside 的 CSS 已经写成 position:relative + z-index，这里留一行兜底说明，
  // 避免后续有人把 CSS 里的 relative 删掉时静默回归。
  const aside = $('detail');
  aside.hidden = false;
  detailId = n.id;

  // 数字字段可能缺失（例如 early-return 的数据），统一兜底，避免 toFixed 抛错把整栏打断
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const fixed = (v, d, k) => num(v, d).toFixed(k);

  // 谁引用了它（入边）/ 它引用了谁（出边）
  const citedByNames = allEdges.filter(e => e.target === n.id && nodeById.has(e.source))
    .map(e => nodeById.get(e.source));
  const citesNames = allEdges.filter(e => e.source === n.id && nodeById.has(e.target))
    .map(e => nodeById.get(e.target));

  const methods = Object.entries(n.match_methods || {})
    .map(([k, v]) => `<span class="chip">${esc(k)} × ${v}</span>`).join('') || '<span class="chip">无（未引用库内论文）</span>';

  aside.innerHTML = `
    <button class="d-close" title="关闭详情">×</button>
    <div class="d-title">${esc(n.title)}</div>
    ${n.arxiv_id ? `<div class="d-row"><span>arXiv</span><span>${esc(n.arxiv_id)}</span></div>` : ''}
    <div class="d-row"><span>综合分 / 名次</span><span>${fixed(n.cornerstone, 0, 3)}${n.cornerstone_rank ? ' / 第 ' + n.cornerstone_rank + ' 名' : ''}</span></div>
    <div class="d-row"><span>角色</span><span class="d-role-cell">
      <details class="role-dd">
        <summary><span class="role role-${esc(n.role)}">${esc(ROLE_LABEL[n.role] || n.role)}</span></summary>
        <div class="role-panel">${rolePanelHTML(n.role)}</div>
      </details>
    </span></div>
    <div class="d-row"><span>被库内引用</span><span>${num(n.cited_by, 0)} 篇</span></div>
    <div class="d-row"><span>引用了库内</span><span>${num(n.cites, 0)} 篇</span></div>
    <div class="d-row"><span>PageRank</span><span>${fixed(n.pagerank, 0, 4)}</span></div>
    <div class="d-row"><span>中介中心性</span><span>${fixed(n.betweenness, 0, 3)}</span></div>
    <div class="d-row"><span>所属引用关系簇</span><span>簇 ${num(n.community, 0) + 1}</span></div>
    <div class="d-row"><span>PDF 副本</span><span>${num(n.copy_count, 0)} 份</span></div>

    <a class="d-open ${n.reader_url ? '' : 'disabled'}" target="_blank"
       ${n.reader_url ? `href="${esc(n.reader_url)}"` : ''}>
       ${n.reader_url ? '打开阅读页 →' : '库里没有可打开的 PDF'}</a>

    <button class="d-act primary" id="dExplore"${n.isolated ? ' disabled style="opacity:.5;cursor:not-allowed"' : ''}>
      以此论文为中心探索
    </button>
    <div style="font-size:11px;color:var(--text-subtle);margin-top:4px;line-height:1.5">
      只保留一阶邻居（它引用的 + 引用它的），其余节点压暗，可再用顶部工具条切换方向
    </div>

    <div class="d-row" style="margin-top:12px"><span>中介中心性名次</span><span>${n.betweenness_pct != null ? '分位 ' + n.betweenness_pct.toFixed(2) : '—'}</span></div>
    <div class="d-row"><span>PageRank 分位</span><span>${n.pagerank_pct != null ? n.pagerank_pct.toFixed(2) : '—'}</span></div>

    <div class="d-sec">引用它的论文（${citedByNames.length}）</div>
    <div class="d-list">${citedByNames.length
      ? citedByNames.map(x => `<a href="#" data-goto="${esc(x.id)}">${esc(truncate(x.title, 40))}</a>`).join('<br/>')
      : '<i style="color:var(--text-subtle)">暂无</i>'}</div>

    <div class="d-sec">它引用的论文（${citesNames.length}）</div>
    <div class="d-list">${citesNames.length
      ? citesNames.map(x => `<a href="#" data-goto="${esc(x.id)}">${esc(truncate(x.title, 40))}</a>`).join('<br/>')
      : '<i style="color:var(--text-subtle)">暂无</i>'}</div>

    <div class="d-sec">匹配方式</div>
    <div>${methods}</div>

    <div class="d-sec">库内文件</div>
    <div class="d-list">${(n.copies || []).map(c => esc(c)).join('<br/>')}</div>
  `;

  aside.querySelectorAll('a[data-goto]').forEach(a => {
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      const t = nodeById.get(a.dataset.goto);
      if (!t) return;
      showDetail(t);
      enterFocus(t.id);
    });
  });

  const exploreBtn = aside.querySelector('#dExplore');
  if (exploreBtn && !n.isolated) {
    exploreBtn.addEventListener('click', () => exploreCenter(n.id));
  }

  // 关闭按钮：ECharts 的 canvas 不拦截 DOM 事件，这里的 handler 不会被图表吞掉
  const closeBtn = aside.querySelector('.d-close');
  if (closeBtn) closeBtn.addEventListener('click', () => hideDetail());
}

// ---------- 底部待核验 ----------
function renderReviews(data) {
  const list = data.reviews || [];
  const total = data.reviews_total || list.length;
  // 低置信度候选：一条都没有进图，只是数据质量记录，措辞不能再暗示"可能被连进来了"
  $('reviewSummary').innerHTML =
    `低置信度匹配（待人工核验）<b>${total}</b> 条 —— <b>一条都没有进图</b>，`
    + `不参与 PageRank、中介中心性和簇划分，仅作为数据质量记录保留；`
    + `新增或更新论文后，这些关系会被重新匹配一次。`;

  if (!list.length) {
    $('reviewList').innerHTML = '<div style="font-size:12px;color:var(--text-subtle);padding:8px 0">没有待核验条目。</div>';
    return;
  }
  // 两类候选的意义完全不同，分开看才不会误读：
  //   arxiv_absent  = 条目里写的 arXiv 号库里压根没有，且库里没有同标题论文（正常缺口）
  //   title_fuzzy   = 标题近似但分数不够，存在被误连的风险，才需要人工过一眼
  $('reviewList').innerHTML = list.map(r => {
    const absent = r.match_method === 'arxiv_absent';
    return `
    <div class="rev">
      <div class="score">${(r.match_score || 0).toFixed(3)}</div>
      <div class="t">
        <b>${esc(r.reference_title || '（无标题）')}</b><br/>
        ${absent
          ? `<i>↳ 库里没有这篇</i>${r.reference_arxiv_id ? '（arXiv ' + esc(r.reference_arxiv_id) + '）' : ''}`
          : `<i>↳ 疑似匹配到：</i>${esc(r.candidate_title || r.candidate || '')}`}
      </div>
    </div>`;
  }).join('');
}

boot();
</script>
