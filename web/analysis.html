<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>论文分析 · 科研小助手</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- 不走 CDN：演示环境可能断网，赛题也要求能离线跑 -->
  <script src="vendor/echarts/echarts.min.js"></script>
  <!-- 全站设计系统：变量 + reset + 基础组件。必须在本页 <style> 之前，
       页面规则才能覆盖它。 -->
  <link rel="stylesheet" href="design-system.css" />
  <!-- 划词翻译浮钮：选中正文里的一段英文，鼠标旁浮出「译」 -->
  <link rel="stylesheet" href="quick-translate.css" />
  <script src="quick-translate.js"></script>
  <!-- 图表取色：ECharts 不认 var()，只能把 CSS 变量的计算值读出来再喂给它 -->
  <script src="chart-colors.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-page); min-height: 100vh; color: var(--text-primary);
    }
    header {
      padding: 12px 18px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 10;
    }
    h1 { font-size: 16px; font-weight: 600; }
    a.back { font-size: 13px; color: var(--brand); text-decoration: none; }
    a.back:hover { text-decoration: underline; }
    .pill { font-size: 12px; color: var(--text-muted); background: var(--bg-muted); padding: 3px 9px; border-radius: var(--radius-pill); }
    .pill b { color: var(--text-secondary); font-weight: 600; }
    .spacer { flex: 1; }
    .tab {
      font-size: 13px; padding: 6px 14px; border: 1px solid var(--border-strong); background: var(--bg-surface);
      border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary);
    }
    .tab.on { background: var(--brand); border-color: var(--brand); color: var(--text-inverse); }
    select, button.act {
      font-size: 13px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-md);
      background: var(--bg-surface); color: var(--text-secondary); cursor: pointer;
    }
    button.act { background: var(--brand); border-color: var(--brand); color: var(--text-inverse); }
    button.act:disabled { background: var(--text-subtle); border-color: var(--text-subtle); cursor: default; }

    main { max-width: var(--content-width-wide); margin: 0 auto; padding: 20px 18px 60px; }

    .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
    .card h2 .sub { font-size: 12px; font-weight: 400; color: var(--text-subtle); margin-left: 8px; }
    .stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat { font-size: 12px; color: var(--text-muted); }
    .stat b { display: block; font-size: 22px; color: var(--brand); font-variant-numeric: tabular-nums; font-weight: 600; }

    .overview { font-size: 14px; line-height: 1.85; color: var(--text-secondary); background: var(--bg-surface-2);
                border-left: 3px solid var(--brand); padding: 12px 16px; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
    .sec { margin-top: 18px; }
    .sec h3 { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;
              padding-bottom: 6px; border-bottom: 1px solid var(--border-color-alt); }
    .sec .body { font-size: 13px; line-height: 1.9; color: var(--text-secondary); white-space: pre-wrap; }

    table.lst { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.lst th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 12px;
                   padding: 8px 10px; background: var(--bg-surface-2); border-bottom: 1px solid var(--border-color); }
    table.lst td { padding: 9px 10px; border-bottom: 1px solid var(--border-color-alt); color: var(--text-secondary); vertical-align: top; }
    table.lst tr:last-child td { border-bottom: none; }
    table.lst tr:hover td { background: var(--bg-surface-2); }
    table.lst td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--brand); font-weight: 600; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); white-space: nowrap; }
    /* 六个角色标签：全站统一口径，与 graph.html 的 .role-* 读同一组 --role-* 变量 */
    .tag.cornerstone { background: var(--role-cornerstone-bg); color: var(--role-cornerstone-fg); }
    .tag.hub         { background: var(--role-hub-bg);         color: var(--role-hub-fg); }
    .tag.bridge      { background: var(--role-bridge-bg);      color: var(--role-bridge-fg); }
    .tag.foundation  { background: var(--role-foundation-bg);  color: var(--role-foundation-fg); }
    .tag.fringe      { background: var(--role-fringe-bg);      color: var(--role-fringe-fg); }
    .tag.isolated    { background: var(--role-isolated-bg);    color: var(--role-isolated-fg); }
    a.open { color: var(--brand); text-decoration: none; font-size: 12px; }
    a.open:hover { text-decoration: underline; }

    #chart { width: 100%; height: 240px; }

    .kind-head { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
    .kind-head .dot { width: 9px; height: 9px; border-radius: 50%; }
    .kind-head b { font-size: 14px; }
    .kind-head .desc { font-size: 12px; color: var(--text-subtle); }
    .fi { border: 1px solid var(--border-color-alt); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .fi .t { font-size: 13.5px; font-weight: 600; color: var(--text-primary); line-height: 1.5; }
    .fi .basis { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.7; }
    .fi .foot { margin-top: 8px; display: flex; gap: 14px; font-size: 12px; color: var(--text-subtle); }

    .empty { text-align: center; color: var(--text-subtle); font-size: 13px; padding: 40px 0; }
    #loading { text-align: center; color: var(--text-subtle); font-size: 13px; padding: 60px 0; }
    [hidden] { display: none !important; }

    /* 英译中 */
    #enInput {
      width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 11px 13px;
      font: inherit; font-size: 13.5px; line-height: 1.75; resize: vertical;
      color: var(--text-primary); background: var(--bg-surface);
    }
    #enInput:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--blue-100); }
    .tr-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    button.ghost-btn { background: var(--bg-surface); border-color: var(--border-strong); color: var(--text-secondary); }
    button.ghost-btn:hover:not(:disabled) { background: var(--bg-surface-2); }
    .tr-hint { font-size: 12px; color: var(--text-subtle); }
    .tr-hint.err { color: var(--danger); }
    .tr-hint.ok { color: var(--success); }
    .tr-out {
      font-size: 13.5px; line-height: 1.95; color: var(--text-secondary); white-space: pre-wrap;
      background: var(--bg-surface-2); border-left: 3px solid var(--brand); padding: 13px 16px;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }

    /* ---------- 论述版综述（1.5.3）与未来工作探索（1.5.4）共用 ---------- */
    /* 注意：这里刻意不用 max-height / overflow-y。
       本页 body 是普通文档流（不是 graph.html 那种 100vh+overflow:hidden），
       让内容自然长高、由浏览器自己滚动，才不会出现「生成完就看不了下面」。 */
    .nar-stages { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .nar-stages:empty { display: none; }
    .nar-stage {
      flex: 1 1 200px; min-width: 0;
      border: 1px solid var(--border-color-alt); border-radius: var(--radius-md);
      padding: 9px 11px; font-size: 12px; line-height: 1.7;
      color: var(--text-secondary); background: var(--bg-surface-2);
    }
    .nar-stage.on { border-color: var(--brand); border-style: dashed; }
    .nar-stage.done { border-color: var(--success); }
    .nar-stage h4 { margin: 0 0 4px; font-size: 12.5px; color: var(--text-primary); }
    .nar-stage .k { color: var(--text-subtle); }

    .nar-body { margin-top: 14px; }
    .nar-body:empty { display: none; }
    .nar-sec { margin: 0 0 16px; }
    .nar-sec h3 {
      margin: 0 0 5px; font-size: 13.5px; color: var(--text-primary);
      border-left: 3px solid var(--brand); padding-left: 8px;
    }
    .nar-sec p { margin: 0; font-size: 13px; line-height: 1.9; color: var(--text-secondary); }
    .nar-cite {
      font-size: 11px; padding: 0 4px; margin: 0 1px; border-radius: var(--radius-sm);
      background: var(--hl-find-text); color: var(--text-primary); cursor: pointer;
    }
    .nar-cite:hover { text-decoration: underline; }
    .nar-rej {
      margin: 0 0 12px; padding: 9px 12px;
      border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
      font-size: 12px; line-height: 1.7; color: var(--text-subtle);
      background: var(--bg-surface-2);
    }
    .nar-rej b { color: var(--text-secondary); font-weight: 600; }

    .dir-body:empty { display: none; }
    .dir-card {
      border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 14px 16px; background: var(--bg-surface); margin-bottom: 14px;
    }
    .dir-card--flat { background: var(--bg-surface-2); border-color: var(--border-color-alt); }
    .dir-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .dir-idx {
      font-size: 11px; padding: 1px 7px; border-radius: var(--radius-sm);
      background: var(--brand); color: var(--text-inverse); flex-shrink: 0;
    }
    .dir-kind {
      font-size: 11px; padding: 1px 7px; border-radius: var(--radius-sm);
      background: var(--hl-find-text); color: var(--text-primary); font-weight: 400;
    }
    .dir-sect { margin-top: 10px; }
    .dir-k { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
    .dir-basis { font-size: 12.5px; line-height: 1.8; color: var(--text-secondary); }
    .dir-quote {
      font-size: 12.5px; line-height: 1.85; color: var(--text-secondary);
      border-left: 3px solid var(--border-strong); padding: 4px 0 4px 11px; margin: 5px 0;
    }
    .dir-quote--none { color: var(--text-subtle); font-style: normal; }
    .dir-cand {
      font-size: 12.5px; line-height: 1.8; color: var(--text-secondary);
      padding: 5px 0; border-bottom: 1px dashed var(--border-color-alt);
    }
    .dir-cand:last-child { border-bottom: none; }
    .dir-cand .dir-yr { color: var(--text-subtle); margin-right: 8px; font-variant-numeric: tabular-nums; }
    .dir-verdict { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: var(--radius-pill); font-weight: 600; }
    .dir-verdict--likely { background: #fdecec; color: #b42318; }
    .dir-verdict--notfound { background: #ecfdf3; color: #027a48; }
    .dir-verdict--unknown { background: var(--bg-muted); color: var(--text-subtle); }
    .dir-reason { font-size: 12.5px; line-height: 1.85; color: var(--text-secondary); margin-top: 7px; }
  </style>
</head>
<body>
  <header>
    <h1>🔎 论文分析</h1>
    <span class="pill" id="stats">加载中…</span>
    <div class="spacer"></div>
    <button class="tab on" id="tabSurvey" data-tab="survey">自动综述</button>
    <button class="tab" id="tabFrontier" data-tab="frontier">前沿探索</button>
    <button class="tab" id="tabDirections" data-tab="directions">未来工作探索</button>
    <button class="tab" id="tabTranslate" data-tab="translate">英译中</button>
    <select id="focus" title="按主题过滤综述范围">
      <option value="">全部主题</option>
    </select>
    <a class="back" href="graph.html">引用图谱 →</a>
    <a class="back" href="index.html">← 返回对话</a>
  </header>

  <main>
    <div id="loading">正在读取图谱数据…</div>

    <!-- 自动综述 -->
    <div id="paneSurvey" hidden>
      <div class="card">
        <h2>领域概览<span class="sub">每句话都可回溯到图上的具体数字</span></h2>
        <div class="stat-row" id="surveyStats"></div>
        <div class="overview" id="surveyOverview"></div>
      </div>

      <!-- 论述版综述（赛题 1.5.3 的「大模型自动生成」）：上面那份概览是
           模板拼串、数字可复核；这里让模型在同样的事实上写一遍论述。
           两条路线不是替代关系——模型不可用时仍以模板版为准。 -->
      <div class="card">
        <h2>论述版综述
          <span class="sub">模型在模板版数字之上写成的五段论述，每段先校验引用再展示</span>
        </h2>
        <div class="tr-row" style="margin-top:0">
          <button class="act" id="narRun">生成论述版综述</button>
          <button class="act ghost-btn" id="narStop" hidden>停止</button>
          <span class="tr-hint" id="narMsg"></span>
        </div>
        <div class="nar-stages" id="narStages"></div>
        <div class="nar-body" id="narBody"></div>
      </div>
      <div class="card">
        <h2>发展脉络</h2>
        <div id="chart"></div>
        <div id="timelineNote" style="font-size:12px;color:var(--text-subtle);margin-top:8px;"></div>
      </div>
      <div class="card">
        <h2>主题聚类与代表性工作</h2>
        <div class="sec" id="secClusters"></div>
        <div class="sec" id="secReps"></div>
        <div class="sec" id="secFringe"></div>
      </div>
    </div>

    <!-- 前沿探索 -->
    <div id="paneFrontier" hidden>
      <div class="card">
        <h2>值得关注的方向<span class="sub">每条都附可核验的量化依据</span></h2>
        <div class="stat-row" id="frontierStats"></div>
      </div>
      <div class="card" id="frontierBody"></div>
    </div>

    <!-- 未来工作探索（赛题 1.5.4）：先抽作者自己写的 Future Work / Limitations，
         再按图谱缺口（桥接 / 孤岛 / 低被引）归纳方向，最后去 arXiv 查最新论文排雷。
         三样东西缺一不可：作者原话、图谱依据、库外检索结果。
         结论一律保守——「可能已被做过」或「没检索到」，不出现「原创」类断言。 -->
    <div id="paneDirections" hidden>
      <div class="card">
        <h2>未来工作探索
          <span class="sub">从作者自述出发，结合图谱缺口归纳方向，再到库外检索最新论文</span>
        </h2>
        <div class="tr-row" style="margin-top:0">
          <button class="act" id="dirRun">探索方向</button>
          <button class="act ghost-btn" id="dirStop" hidden>停止</button>
          <span class="tr-hint" id="dirMsg"></span>
        </div>
        <div class="nar-stages" id="dirStages"></div>
      </div>
      <div id="dirBody" class="dir-body"></div>
    </div>

    <!-- 英译中：读论文时遇到看不懂的段落，选中贴进来就译 -->
    <div id="paneTranslate" hidden>
      <div class="card">
        <h2>英文段落翻译<span class="sub">从论文里复制一段，贴进来译成中文</span></h2>
        <textarea id="enInput" rows="9" placeholder="把英文原文贴在这里……"></textarea>
        <div class="tr-row">
          <button class="act" id="btnEn2zh">译成中文</button>
          <button class="act ghost-btn" id="btnClear">清空</button>
          <span class="tr-hint" id="trHint"></span>
        </div>
      </div>
      <div class="card" id="trOutCard" hidden>
        <h2>中文译文</h2>
        <div class="tr-out" id="zhOutput"></div>
      </div>
    </div>
  </main>

  <script>
    const ROLE_CN = {
      cornerstone: '基石', hub: '枢纽', bridge: '桥接',
      foundation: '基础件', fringe: '边缘', isolated: '孤立'
    };

    /* ECharts 不认 CSS 的 var()，图表颜色只能读变量的计算值再喂给它。
       ChartColors.read() 内部带兜底值，读不到变量时退回与改造前完全相同的色值，
       所以 design-system.css 万一没加载，图表也不会黑掉或白掉。
       这里不在顶层取色，是因为 <script src="chart-colors.js"> 的加载顺序
       不保证早于本段内联脚本；放在渲染函数里取，必定发生在 CSS 就绪之后。 */
    function chartKindColors() {
      const C = ChartColors.read();
      return {
        recent_cited: C.chartBrand,
        bridge:       C.chartAccent,
        island:       C.chartDanger,
        fallback:     C.textSubtle
      };
    }

    let surveyData = null;
    let frontierData = null;
    let chart = null;

    function $(id) { return document.getElementById(id); }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    async function getJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
      return r.json();
    }

    // ---------- 自动综述 ----------
    function renderSurvey() {
      const d = surveyData;
      const st = d.stats || {};
      $('surveyStats').innerHTML = [
        ['论文数', st.papers], ['引用边', st.edges],
        ['引用关系簇', st.clusters], ['时间跨度', st.years]
      ].map(([k, v]) => `<div class="stat">${esc(k)}<b>${esc(v)}</b></div>`).join('');

      $('surveyOverview').textContent = d.overview || '';

      // 时间轴柱状图：每年论文数
      const years = (d.timeline || []);
      if (chart) { chart.dispose(); chart = null; }
      if (years.length) {
        const C = ChartColors.read();
        chart = echarts.init($('chart'));
        chart.setOption({
          grid: { left: 44, right: 20, top: 26, bottom: 30 },
          tooltip: {
            trigger: 'axis',
            formatter: ps => {
              const i = ps[0].dataIndex, y = years[i];
              return `<b>${y.year} 年</b>（${y.count} 篇）<br/>`
                + y.papers.slice(0, 6).map(p => `${esc(p.title)} —— 被引 ${p.cited_by}`).join('<br/>');
            }
          },
          xAxis: {
            type: 'category', data: years.map(y => y.year),
            axisLine: { lineStyle: { color: C.chartAxis } },
            axisLabel: { color: C.chartLabel, fontSize: 11 }
          },
          yAxis: {
            type: 'value', name: '篇', nameTextStyle: { color: C.chartLabel2, fontSize: 11 },
            splitLine: { lineStyle: { color: C.chartGrid } },
            axisLabel: { color: C.chartLabel2, fontSize: 11 }
          },
          series: [{
            type: 'bar', data: years.map(y => y.count), barWidth: '52%',
            itemStyle: { color: C.chartBrand, borderRadius: [4, 4, 0, 0] },
            label: { show: true, position: 'top', color: C.chartLabel, fontSize: 11 }
          }]
        });
      }
      const noYear = st.papers - years.reduce((a, y) => a + y.count, 0);
      $('timelineNote').textContent = noYear > 0
        ? `另有 ${noYear} 篇因库内元数据缺少年份，未计入时间轴（概览中已逐篇说明）。`
        : '全部论文都已计入时间轴。';

      // 主题聚类
      const cl = d.clusters || [];
      $('secClusters').innerHTML = '<h3>引用关系簇</h3><div class="body">'
        + cl.map(c => `引用关系簇 ${c.community}：${c.size} 篇`
          + (c.category ? `，主要集中在「${esc(c.category)}」` : '')
          + `，代表工作《${esc(c.lead)}》`).join('\n') + '</div>';

      // 代表性工作
      const reps = d.representatives || [];
      $('secReps').innerHTML = '<h3>代表性工作</h3>'
        + (reps.length ? '<table class="lst"><thead><tr><th>论文</th><th>年份</th><th>角色</th>'
          + '<th style="text-align:right">基石分</th><th style="text-align:right">被引</th><th></th></tr></thead><tbody>'
          + reps.map(n => `<tr>
              <td>${esc(n.title)}</td>
              <td>${esc(n.year || '—')}</td>
              <td><span class="tag ${esc(n.role)}">${esc(ROLE_CN[n.role] || n.role)}</span></td>
              <td class="num">${n.score.toFixed(3)}</td>
              <td class="num">${n.cited_by}</td>
              <td>${n.reader_url ? `<a class="open" href="${esc(n.reader_url)}">阅读</a>` : ''}</td>
            </tr>`).join('') + '</tbody></table>'
          : '<div class="body">暂无。</div>');

      // 综合地位靠后的工作
      const fringe = (d.sections || []).find(s => s.heading === '综合地位靠后的工作');
      $('secFringe').innerHTML = fringe
        ? `<h3>${esc(fringe.heading)}</h3><div class="body">${esc(fringe.body)}</div>` : '';
    }

    // ---------- 前沿探索 ----------
    function renderFrontier() {
      const d = frontierData;
      const st = d.stats || {};
      $('frontierStats').innerHTML = [
        ['新近且被引', st.recent_cited], ['跨簇桥接', st.bridges],
        ['未被接入', st.islands], ['分析论文', st.papers]
      ].map(([k, v]) => `<div class="stat">${esc(k)}<b>${esc(v)}</b></div>`).join('');

      const legend = {};
      (d.legend || []).forEach(l => { legend[l.kind] = l; });

      const byKind = {};
      (d.items || []).forEach(it => { (byKind[it.kind] = byKind[it.kind] || []).push(it); });

      const order = ['recent_cited', 'bridge', 'island'];
      const KC = chartKindColors();
      let html = '';
      order.forEach(kind => {
        const arr = byKind[kind] || [];
        if (!arr.length) return;
        const lg = legend[kind] || {};
        html += `<div class="kind-head">
            <span class="dot" style="background:${KC[kind] || KC.fallback}"></span>
            <b>${esc(lg.label || kind)}</b>
            <span class="desc">${esc(lg.desc || '')}</span>
          </div>`;
        arr.forEach(it => {
          html += `<div class="fi">
              <div class="t">${esc(it.title)}</div>
              <div class="basis">${esc(it.basis)}</div>
              <div class="foot">
                <span>${it.year ? esc(it.year) + ' 年' : '年份未知'}</span>
                ${it.reader_url ? `<a class="open" href="${esc(it.reader_url)}">打开原文</a>` : ''}
              </div>
            </div>`;
        });
      });
      $('frontierBody').innerHTML = html || '<div class="empty">暂无前沿线索。</div>';
    }

    // ---------- 装载 ----------
    async function load(which) {
      $('loading').hidden = false;
      $('loading').textContent = '正在读取图谱数据…';
      try {
        if (which === 'survey') {
          const focus = $('focus').value;
          surveyData = await getJSON('/graph/survey' + (focus ? '?focus=' + encodeURIComponent(focus) : ''));
          if (!surveyData.ready) throw new Error(surveyData.detail || '综述生成失败');
          renderSurvey();
          // 主题下拉只装一次
          const sel = $('focus');
          if (sel.options.length <= 1 && surveyData.topics) {
            surveyData.topics.forEach(t => {
              const o = document.createElement('option');
              o.value = t; o.textContent = t; sel.appendChild(o);
            });
          }
        } else {
          frontierData = await getJSON('/graph/frontier');
          if (!frontierData.ready) throw new Error(frontierData.detail || '前沿探索失败');
          renderFrontier();
        }
        $('loading').hidden = true;
      } catch (e) {
        $('loading').textContent = '加载失败：' + e.message;
      }
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
      $('paneSurvey').hidden = name !== 'survey';
      $('paneFrontier').hidden = name !== 'frontier';
      $('paneDirections').hidden = name !== 'directions';
      $('paneTranslate').hidden = name !== 'translate';
      // 主题过滤只对综述有意义
      $('focus').hidden = name !== 'survey';
      // 翻译与未来工作探索不需要读图谱数据，加载中提示别挡路
      if (name === 'translate' || name === 'directions') { $('loading').hidden = true; return; }
      if (name === 'survey' && !surveyData) load('survey');
      if (name === 'frontier' && !frontierData) load('frontier');
      if (name === 'survey' && chart) chart.resize();
    }

    document.querySelectorAll('.tab').forEach(b => {
      b.addEventListener('click', () => switchTab(b.dataset.tab));
    });
    $('focus').addEventListener('change', () => { surveyData = null; load('survey'); });
    window.addEventListener('resize', () => { if (chart) chart.resize(); });

    // ---------- 英译中 ----------
    // 复用 /translate/selection：它内部就是「分块 → 逐块调模型 → 拼回来」，
    // 不校验文字来源，正好拿来翻译整段。没必要为方向相反再写一个接口。
    $('btnClear').addEventListener('click', () => {
      $('enInput').value = '';
      $('trOutCard').hidden = true;
      trHint('', '');
    });

    $('btnEn2zh').addEventListener('click', async () => {
      const text = $('enInput').value.trim();
      if (!text) { trHint('先贴一段英文', 'err'); return; }
      // 后端 /translate/selection 卡 max_length=6000，超了会回 422，
      // 不如在这里就拦住，提示得清楚。
      if (text.length > 6000) {
        trHint(`太长：${text.length} 字符，一次最多 6000，请分段译`, 'err');
        return;
      }
      const btn = $('btnEn2zh');
      btn.disabled = true;
      trHint('翻译中…（约 3-15 秒）', '');
      try {
        const r = await fetch('/translate/selection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, context: '' })
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.detail || ('HTTP ' + r.status));
        }
        const d = await r.json();
        const zh = (d.markdown || '').trim();
        if (!zh) throw new Error('模型没有返回译文');
        $('zhOutput').textContent = zh;
        $('trOutCard').hidden = false;
        trHint(`完成 · ${text.length} 字符 → ${zh.length} 字`, 'ok');

    });

    function trHint(msg, cls) {
      const el = $('trHint');
      el.textContent = msg;
      el.className = 'tr-hint' + (cls ? ' ' + cls : '');
    }

    // 顶栏统计：用 /graph 的 summary，顺便验证图上数据一致性
    getJSON('/graph').then(g => {
      const s = g.summary || {};
      $('stats').innerHTML = `论文 <b>${s.node_count ?? '—'}</b> · 引用边 <b>${s.edge_count ?? '—'}</b>`;
    }).catch(() => { $('stats').textContent = '图谱未就绪'; });

    // ================== 论述版综述（赛题 1.5.3） ==================
    // 与 /graph/survey 的分工：模板版是降级路径（数字 100% 可复核），
    // 这里让模型在同样的事实上写一遍论述，每段先校验引用再下发。
    const NAR_STAGE_LABEL = {
      planner: '规划 Planner', analyst: '证据 Analyst',
      writer: '撰写 Writer', verifier: '校验 Verifier'
    };
    let narCtl = null;
    let narCitationIndex = {};

    function narMsg(text, isErr) {
      const el = $('narMsg');
      el.textContent = text || '';
      el.className = 'tr-hint' + (isErr ? ' err' : '');
    }

    function narReset() {
      $('narStages').textContent = '';
      $('narBody').textContent = '';
      narCitationIndex = {};
      narMsg('');
    }

    function narStageCard(role) {
      const box = document.createElement('div');
      box.className = 'nar-stage on';
      box.dataset.role = role;
      const h = document.createElement('h4');
      h.textContent = NAR_STAGE_LABEL[role] || role;
      box.appendChild(h);
      const body = document.createElement('div');
      box.appendChild(body);
      $('narStages').appendChild(box);
      return { box, body };
    }

    function narStageText(role, ev) {
      const card = $('narStages').querySelector(`.nar-stage[data-role="${role}"]`);
      if (!card) return;
      card.classList.remove('on');
      card.classList.add('done');
      const body = card.lastChild;
      const secs = ev.sections || [];
      if (role === 'planner') {
        body.textContent = `拟写 ${secs.length} 段：` + secs.map(s => s.heading || s.key).join('、');
      } else if (role === 'analyst') {
        const n = secs.reduce((a, s) => a + (s.picks || []).length, 0);
        body.textContent = `为 ${secs.length} 段共挑出 ${n} 条证据（来自 ${ev.citable || 0} 篇论文）`;
      } else if (role === 'writer') {
        body.textContent = `分 ${secs.length} 段，每段一次模型调用`;
      } else if (role === 'verifier') {
        const s = ev.stats || {};
        let t = `引用 ${ev.citations || 0} 处，段通过 ${s.sections_ok ?? '—'}/${secs.length || 5}`;
        if (ev.rejected && ev.rejected.length) t += `，丢弃 ${ev.rejected.length} 段`;
        if (ev.unverified && ev.unverified.length) t += `，待人工留意 ${ev.unverified.length} 处`;
        body.textContent = t;
        (ev.unverified || []).slice(0, 3).forEach(u => {
          const d = document.createElement('div');
          d.className = 'k';
          d.textContent = `· ${u.citation} ${u.reason || ''}`;
          body.appendChild(d);
        });
      }
    }

    // 把正文里的 [arxiv:1706.03762] 变成可点的角标，鼠标悬停看标题与年份。
    function renderNarCites(container, text, index) {
      const re = /[\[【]\s*(?:cite:|CITE:|@)?([A-Za-z0-9][\w:.\-]*?)\s*[\]】]/g;
      let last = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) {
          container.appendChild(document.createTextNode(text.slice(last, m.index)));
        }
        const id = m[1];
        const info = index[id] || {};
        const tag = document.createElement(info.paper ? 'a' : 'span');
        tag.className = 'nar-cite';
        tag.textContent = id;
        tag.title = info.paper
          ? `${info.paper}${info.year ? '（' + info.year + '）' : ''}`
          : id;
        if (info.paper) { tag.href = '/ui/reader.html?paper=' + encodeURIComponent(info.paper); tag.target = '_blank'; }
        container.appendChild(tag);
        last = re.lastIndex;
      }
      if (last < text.length) {
        container.appendChild(document.createTextNode(text.slice(last)));
      }
    }

    function narAddSection(ev) {
      const sec = document.createElement('div');
      sec.className = 'nar-sec';
      const h = document.createElement('h3');
      h.textContent = ev.heading || '';
      sec.appendChild(h);
      const p = document.createElement('p');
      // 模型偶尔会在正文开头重复一遍 "## 标题"，剥掉
      renderNarCites(p, String(ev.text || '').replace(/^\s*#{1,6}\s*[^\n]*\n/, ''), narCitationIndex);
      sec.appendChild(p);
      $('narBody').appendChild(sec);
    }

    function narAddRejected(ev) {
      const box = document.createElement('div');
      box.className = 'nar-rej';
      const b = document.createElement('b');
      b.textContent = '已丢弃：' + (ev.heading || ev.key || '某一段');
      box.appendChild(b);
      box.appendChild(document.createTextNode('　' + (ev.reason || '')));
      $('narBody').appendChild(box);
    }

    function narFinish(stats) {
      $('narRun').disabled = false;
      $('narRun').textContent = '重新生成';
      $('narStop').hidden = true;
      const s = stats || {};
      if (s.budget_exhausted) {
        narMsg('模型调用预算今天已用完，后面的段落没有生成。', true);
        return;
      }
      const ok = s.sections_ok ?? 0;
      const miss = 5 - ok;
      narMsg(miss > 0
        ? `共 ${ok}/5 段通过校验，其余 ${miss} 段已丢弃（原因见下方虚线框）。模型调用 ${s.llm_calls ?? '—'} 次。`
        : `全部 5 段通过校验。模型调用 ${s.llm_calls ?? '—'} 次。`, false);
    }

    async function runNarrative() {
      if (narCtl) return;
      narReset();
      narCtl = new AbortController();
      $('narRun').disabled = true;
      $('narRun').textContent = '生成中…';
      $('narStop').hidden = false;
      const started = Date.now();
      const tick = setInterval(() => {
        narMsg(`正在生成（已 ${Math.round((Date.now() - started) / 1000)} 秒）…`);
      }, 15000);
      try {
        const r = await fetch('/graph/survey/narrative', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ focus: $('focus').value || '' }),
          signal: narCtl.signal
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let cut;
          while ((cut = buf.indexOf('\n\n')) >= 0) {
            const frame = buf.slice(0, cut);
            buf = buf.slice(cut + 2);
            for (const line of frame.split('\n')) {
              if (!line.startsWith('data: ')) continue;
              let ev;
              try { ev = JSON.parse(line.slice(6)); } catch { continue; }
              if (ev.type === 'role') {
                if (ev.role !== 'writer' || !$('narStages').querySelector('.nar-stage[data-role="writer"]')) {
                  narStageCard(ev.role);
                }
                narStageText(ev.role, ev);
                if (ev.role === 'analyst') {
                  (ev.sections || []).forEach(s => {
                    (s.picks || []).forEach(p => { narCitationIndex[p.id] = { paper: p.title, year: p.year }; });
                  });
                }
              } else if (ev.type === 'section_start') {
                narMsg(`正在写第 ${ev.index}/${ev.total} 段：${ev.heading}…`);
              } else if (ev.type === 'answer_delta') {
                narAddSection(ev);
              } else if (ev.type === 'section_rejected') {
                narAddRejected(ev);
              } else if (ev.type === 'done') {
                narFinish(ev.stats);
              } else if (ev.type === 'error') {
                narMsg(ev.message || '生成失败', true);
              }
            }
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') narMsg('已停止。已经出来的段落都是校验通过的。');
        else narMsg('失败：' + e.message, true);
      } finally {
        clearInterval(tick);
        narCtl = null;
        $('narRun').disabled = false;
        if ($('narRun').textContent === '生成中…') $('narRun').textContent = '生成论述版综述';
        $('narStop').hidden = true;
      }
    }

    $('narRun').addEventListener('click', runNarrative);
    $('narStop').addEventListener('click', () => { if (narCtl) narCtl.abort(); });

    // ================== 未来工作探索（赛题 1.5.4） ==================
    const DIR_VERDICT_LABEL = {
      likely_done: '可能已被做过', not_found: '没检索到高度相似的工作',
      unclear: '判断不了', unchecked: '未做判断'
    };
    const DIR_STATUS_NOTE = {
      success: '已抽到作者自述',
      no_section: '这篇没有 Future Work / Limitations 这类章节',
      no_valid_sentence: '有章节，但里面没有可用的句子',
      parse_error: 'PDF 解析失败'
    };
    // 前端第二道兜底：后端已做清洗，这里再防一次，绝不让「原创」类断言漏到页面上。
    const DIR_FORBIDDEN = ['原创', '首次提出', '没人做过', '首创'];
    let dirCtl = null;

    function dirMsg(text, isErr) {
      const el = $('dirMsg');
      el.textContent = text || '';
      el.className = 'tr-hint' + (isErr ? ' err' : '');
    }

    function dirReset() {
      $('dirStages').textContent = '';
      $('dirBody').textContent = '';
      dirMsg('');
    }

    function dirSanitize(text) {
      let t = String(text == null ? '' : text);
      DIR_FORBIDDEN.forEach(w => { t = t.split(w).join('尚待核实'); });
      return t;
    }

    function dirStageCard(role) {
      const box = document.createElement('div');
      box.className = 'nar-stage on';
      box.dataset.role = role;
      const h = document.createElement('h4');
      h.textContent = { extractor: '抽取 Extractor', mapper: '归纳 Mapper',
                        searcher: '检索 Searcher', judge: '判断 Judge' }[role] || role;
      box.appendChild(h);
      const body = document.createElement('div');
      box.appendChild(body);
      $('dirStages').appendChild(box);
      return { box, body };
    }

    function dirStageText(role, ev) {
      const card = $('dirStages').querySelector(`.nar-stage[data-role="${role}"]`);
      if (!card) return;
      const body = card.lastChild;
      if (role === 'extractor') {
        const e = ev.extraction || {};
        const c = e.counts || {};
        body.textContent = `读了 ${e.total ?? '—'} 篇，抽到作者自述 ${c.success ?? 0} 篇`
          + (c.no_section ? `，无相关章节 ${c.no_section} 篇` : '')
          + (c.no_valid_sentence ? `，无可用句子 ${c.no_valid_sentence} 篇` : '')
          + (c.parse_error ? `，解析失败 ${c.parse_error} 篇` : '')
          + `（覆盖率 ${e.coverage != null ? Math.round(e.coverage * 100) + '%' : '—'}）`;
      } else if (role === 'mapper') {
        body.textContent = `按图谱缺口归纳出 ${ev.directions ?? '—'} 个方向`;
      } else if (role === 'searcher') {
        body.textContent = `检索方向「${dirSanitize(ev.title || '')}」的库外最新论文…`;
      } else if (role === 'judge') {
        body.textContent = `判断方向「${dirSanitize(ev.title || '')}」：`
          + (DIR_VERDICT_LABEL[ev.verdict] || ev.verdict || '—');
      }
    }

    function dirSection(parent, label, cls) {
      const box = document.createElement('div');
      box.className = 'dir-sect';
      const k = document.createElement('div');
      k.className = 'dir-k';
      k.textContent = label;
      box.appendChild(k);
      if (cls) {
        const c = document.createElement('div');
        c.className = cls;
        box.appendChild(c);
        parent.appendChild(box);
        return c;
      }
      parent.appendChild(box);
      return box;
    }

    function dirAddDirection(ev) {
      const it = ev.item || {};
      const card = document.createElement('div');
      card.className = 'dir-card';
      const h = document.createElement('h3');
      const idx = document.createElement('span');
      idx.className = 'dir-idx';
      idx.textContent = it.id || '';
      const kind = document.createElement('span');
      kind.className = 'dir-kind';
      kind.textContent = it.kind_label || it.kind || '';
      const title = document.createElement('span');
      title.textContent = dirSanitize(it.title || it.anchor_title || '（未命名）');
      h.append(idx, kind, title);
      card.appendChild(h);

      const basis = dirSection(card, '图谱依据', 'dir-basis');
      basis.textContent = it.basis || '';

      const evBox = dirSection(card, '作者原话');
      const status = it.evidence_status || '';
      const note = document.createElement('div');
      note.className = 'dir-basis';
      note.textContent = `状态：${DIR_STATUS_NOTE[status] || status}`
        + (it.evidence_section ? `　章节：${it.evidence_section}` : '');
      evBox.appendChild(note);
      if ((it.evidence || []).length) {
        it.evidence.forEach(s => {
          const q = document.createElement('div');
          q.className = 'dir-quote';
          q.textContent = s;
          evBox.appendChild(q);
        });
      } else {
        const q = document.createElement('div');
        q.className = 'dir-quote dir-quote--none';
        q.textContent = '这篇论文没有可用的作者自述，本方向的方向性由图谱缺口给出，不含作者原话。';
        evBox.appendChild(q);
      }

      const candBox = dirSection(card, '库外检索到的最新论文（含来源与年份）');
      const cands = it.candidates || [];
      if (cands.length) {
        cands.forEach(c => {
          const row = document.createElement('div');
          row.className = 'dir-cand';
          const yr = document.createElement('span');
          yr.className = 'dir-yr';
          yr.textContent = (c.year || '年份未知') + ' · ' + (c.source || '来源未知');
          row.appendChild(yr);
          if (c.url) {
            const a = document.createElement('a');
            a.className = 'open';
            a.href = c.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = dirSanitize(c.title || '');
            row.appendChild(a);
          } else {
            row.appendChild(document.createTextNode(dirSanitize(c.title || '')));
          }
          candBox.appendChild(row);
        });
      } else {
        const row = document.createElement('div');
        row.className = 'dir-cand';
        row.textContent = '这次没有检索到库外论文（可能是网络不可用或检索词过窄）。';
        candBox.appendChild(row);
      }

      const vBox = dirSection(card, '相似性判断');
      const badge = document.createElement('span');
      const v = it.verdict || 'unchecked';
      badge.className = 'dir-verdict ' + (v === 'likely_done' ? 'dir-verdict--likely'
        : v === 'not_found' ? 'dir-verdict--notfound' : 'dir-verdict--unknown');
      badge.textContent = DIR_VERDICT_LABEL[v] || v;
      vBox.appendChild(badge);
      const reason = document.createElement('div');
      reason.className = 'dir-reason';
      reason.textContent = dirSanitize(it.reason || '');
      vBox.appendChild(reason);

      $('dirBody').appendChild(card);
    }

    function dirFinish(stats) {
      $('dirRun').disabled = false;
      $('dirRun').textContent = '重新探索';
      $('dirStop').hidden = true;
      const s = stats || {};
      if (s.budget_exhausted) {
        dirMsg('模型调用预算今天已用完，后面的方向没有做完判断。', true);
        return;
      }
      dirMsg(`完成：${s.directions ?? 0} 个方向，模型调用 ${s.judge_calls ?? '—'} 次。`
        + '判断只基于本次检索到的论文标题与摘要，没有检索到也不等于该方向无人做过。', false);
    }

    async function runDirections() {
      if (dirCtl) return;
      dirReset();
      dirCtl = new AbortController();
      $('dirRun').disabled = true;
      $('dirRun').textContent = '探索中…';
      $('dirStop').hidden = false;
      const started = Date.now();
      const tick = setInterval(() => {
        dirMsg(`正在探索（已 ${Math.round((Date.now() - started) / 1000)} 秒）…`);
      }, 15000);
      try {
        const r = await fetch('/graph/directions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
          signal: dirCtl.signal
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let cut;
          while ((cut = buf.indexOf('\n\n')) >= 0) {
            const frame = buf.slice(0, cut);
            buf = buf.slice(cut + 2);
            for (const line of frame.split('\n')) {
              if (!line.startsWith('data: ')) continue;
              let ev;
              try { ev = JSON.parse(line.slice(6)); } catch { continue; }
              if (ev.type === 'role') {
                if (!ev.role) continue;
                if (ev.role !== 'searcher' && ev.role !== 'judge') {
                  if (!$('dirStages').querySelector(`.nar-stage[data-role="${ev.role}"]`)) dirStageCard(ev.role);
                } else if (!$('dirStages').querySelector(`.nar-stage[data-role="${ev.role}"]`)) {
                  dirStageCard(ev.role);
                }
                dirStageText(ev.role, ev);
                if (ev.role !== 'searcher' && ev.role !== 'judge') {
                  const c = $('dirStages').querySelector(`.nar-stage[data-role="${ev.role}"]`);
                  if (c) { c.classList.remove('on'); c.classList.add('done'); }
                }
              } else if (ev.type === 'direction_start') {
                dirMsg(`正在处理第 ${ev.index}/${ev.total} 个方向：${dirSanitize(ev.title || '')}…`);
              } else if (ev.type === 'direction') {
                dirAddDirection(ev);
              } else if (ev.type === 'done') {
                dirFinish(ev.stats);
              } else if (ev.type === 'error') {
                dirMsg(ev.message || '探索失败', true);
              }
            }
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') dirMsg('已停止。');
        else dirMsg('失败：' + e.message, true);
      } finally {
        clearInterval(tick);
        dirCtl = null;
        $('dirRun').disabled = false;
        if ($('dirRun').textContent === '探索中…') $('dirRun').textContent = '探索方向';
        $('dirStop').hidden = true;
      }
    }

    $('dirRun').addEventListener('click', runDirections);
    $('dirStop').addEventListener('click', () => { if (dirCtl) dirCtl.abort(); });

    switchTab('survey');

    // 划词翻译：挂到综述和前沿探索的正文区。选中一段英文，鼠标旁就浮出「译」。
    // 和阅读器里的划词是同一套交互，代码共用 quick-translate.js。
    QuickTranslate.attach(
      document.getElementById('paneSurvey'),
      document.getElementById('paneFrontier')
    );
  </script>
</body>
</html>
