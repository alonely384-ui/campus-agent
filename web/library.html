<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>论文库 · 科研小助手</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="design-system.css" />
  <!-- 侧栏宽度要在首帧之前就填进 :root，否则会先按默认 264px 画一帧再跳到用户设的宽度 -->
  <script>
    (function () {
      try {
        var w = parseInt(localStorage.getItem('campus-agent-sidebar-w-v1') || '', 10);
        if (w >= 200 && w <= 480) document.documentElement.style.setProperty('--sidebar-w', w + 'px');
      } catch (e) { /* 隐私模式读不到，用默认宽度 */ }
    })();
  </script>
  <style>
    /* 整页内容区：和对话页用同一套 .main__scroll / .main__inner 骨架 */
    .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
    .page-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -.2px; margin: 0; }
    .page-head .count { font-size: 12.5px; color: var(--text-muted); }
    .page-sub { font-size: 13px; color: var(--text-secondary); margin: 6px 0 18px; line-height: 1.7; }
    .page-sub b { color: var(--text-primary); font-weight: 600; }

    .panel {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-card);
      box-shadow: var(--shadow-card); padding: 18px 20px; margin-bottom: 16px;
    }

    #dropZone {
      border: 2px dashed var(--border-strong); border-radius: var(--radius-card); padding: 22px; text-align: center;
      color: var(--text-secondary); font-size: 14px; transition: .15s; background: var(--bg-surface-2);
    }
    #dropZone.hot { border-color: var(--brand); background: var(--brand-soft); }
    #dropZone .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

    .btn-sm { padding: 7px 14px; border-radius: var(--radius-control); font-size: 13px;
              background: var(--bg-muted); color: var(--text-secondary); }
    .btn-sm:hover { background: var(--bg-active); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-border); }

    #upStatus { margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); white-space: pre-line; }

    .lib-list { display: flex; flex-direction: column; gap: 6px; }
    .lib-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border-color);
               border-radius: var(--radius-control); font-size: 13px; background: var(--bg-surface-2); }
    .lib-row:hover { border-color: var(--border-brand); }
    .lib-row .meta { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
    .lib-row .act { display: flex; gap: 6px; }
    .lib-row a { font-size: 12px; color: var(--brand); text-decoration: none; padding: 5px 8px;
                 border-radius: var(--radius-sm); }
    .lib-row a:hover { background: var(--brand-soft); }

    .pill { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-pill); white-space: nowrap; }
    .pill.dup { background: var(--warning-bg); color: var(--warning); }
    .pill.ok { background: var(--success-bg); color: var(--success); }
    .pill.keep { background: var(--brand-soft); color: var(--brand-active); font-weight: 600; }

    /* 重复副本折叠：主版本一行 + 一个「已合并 N 份副本」开关，展开才占版面。
       评委翻论文库时第一眼看到的是干净的主清单，点开才看到同一篇论文的其它版本。 */
    .dup-group { display: flex; flex-direction: column; }
    .dup-toggle { display: flex; align-items: center; gap: 6px; align-self: flex-start;
                  margin: 2px 0 6px 12px; padding: 3px 8px; border: none; background: none;
                  font-size: 11.5px; color: var(--brand); cursor: pointer; border-radius: var(--radius-sm); }
    .dup-toggle:hover { background: var(--brand-soft); }
    .dup-toggle__caret { display: inline-block; width: 9px; font-size: 10px; }
    .dup-toggle__hint { color: var(--text-muted); }
    .dup-sub { display: flex; flex-direction: column; gap: 6px; margin: 0 0 6px 12px;
               padding-left: 10px; border-left: 2px solid var(--border-color); }
    .dup-sub[hidden] { display: none; }
    .lib-row--sub { background: var(--bg-surface); font-size: 12.5px; }
    .lib-row--sub .name { font-weight: 400; }

    .dup-box { margin-top: 12px; border: 1px solid var(--warning-border); background: var(--bg-warm);
               border-radius: 10px; padding: 10px 12px; }
    .dup-box h3 { font-size: 13px; margin: 0 0 8px; color: var(--warning); }
    .dup-row { border-top: 1px dashed var(--warning-border); padding: 8px 0; font-size: 13px; }
    .dup-row:first-of-type { border-top: none; }
    .dup-row .choices { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; font-size: 12.5px;
                        color: var(--text-secondary); }
    .dup-row .choices label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .empty { font-size: 13px; color: var(--text-muted); padding: 18px 4px; text-align: center; }

    /* ---- 主题筛选栏 ---- */
    .topic-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .topic-bar__label { font-size: 12.5px; color: var(--text-muted); margin-right: 2px; }
    .topic-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: var(--radius-pill); font-size: 13px; cursor: pointer;
      border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary);
      transition: background .15s, border-color .15s, color .15s;
    }
    .topic-chip:hover { border-color: var(--border-brand); color: var(--text-primary); }
    .topic-chip.on {
      background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600;
    }
    .topic-chip__n { font-size: 11.5px; opacity: .75; }
    .topic-chip.on .topic-chip__n { opacity: .9; }
    /* 待分类：虚线边框，提示这是"证据不足"的兜底桶，不是分类结论 */
    .topic-chip--pending { border-style: dashed; color: var(--text-muted); }

    /* ---- 分类管理弹窗 ---- */
    .bucket-hint {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin: -4px 0 14px; font-size: 12.5px; color: var(--text-muted);
    }
    .bucket-hint__text { flex: 1 1 240px; min-width: 0; }
    .bkmask {
      position: fixed; inset: 0; z-index: 300; display: flex; align-items: center;
      justify-content: center; background: rgba(15, 23, 32, .38); padding: 20px;
    }
    /* display:flex 会盖掉浏览器给 [hidden] 的 display:none，不补这条遮罩层
       即使"看不见"也会拦截全页点击（实测点了筛选条没反应）。 */
    .bkmask[hidden] { display: none; }
    .bkpanel {
      width: min(560px, 100%); max-height: min(78vh, 720px); overflow: auto;
      background: var(--bg-surface); border: 1px solid var(--border-color);
      border-radius: var(--radius-card); box-shadow: 0 18px 48px rgba(15, 23, 32, .18);
    }
    .bkpanel__head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; background: var(--bg-surface);
    }
    .bkpanel__body { padding: 14px 16px 18px; }
    .bkhint { font-size: 12.5px; color: var(--text-muted); line-height: 1.65; margin-bottom: 12px; }
    .bkmsg {
      font-size: 12.5px; border-radius: var(--radius-control); padding: 8px 10px; margin-bottom: 10px;
      background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border-color);
    }
    .bkmsg.err { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .bktable { width: 100%; border-collapse: collapse; font-size: 13px; }
    .bktable th {
      text-align: left; font-weight: 500; font-size: 12px; color: var(--text-muted);
      padding: 6px 8px; border-bottom: 1px solid var(--border-color);
    }
    .bktable td { padding: 7px 8px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .bktable td.n { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .bktable td.ops { white-space: nowrap; text-align: right; }
    .bktag {
      font-size: 11px; padding: 1px 7px; border-radius: 999px;
      border: 1px solid var(--border-color); color: var(--text-muted);
    }
    .bkadd { display: flex; gap: 8px; margin-top: 14px; }
    .bkadd input {
      flex: 1; padding: 7px 10px; font-size: 13px; border-radius: var(--radius-control);
      border: 1px solid var(--border-color); background: var(--bg-base); color: var(--text-primary);
      font-family: inherit;
    }
    .bkadd input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }

    /* ---- 标题行：真实标题 + 文件名副信息 ---- */
    .lib-row .titlewrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .lib-row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-row .file { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono);
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-row .cited { font-size: 11px; color: var(--text-subtle); white-space: nowrap; }

    /* ---- 分页器 ---- */
    .pager { display: flex; align-items: center; justify-content: center; gap: 6px;
             flex-wrap: wrap; padding: 16px 0 4px; }
    .pager__btn {
      min-width: 34px; padding: 6px 10px; border-radius: var(--radius-control); font-size: 13px;
      border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary);
      cursor: pointer;
    }
    .pager__btn:hover:not(:disabled):not(.on) { border-color: var(--border-brand); color: var(--text-primary); }
    .pager__btn.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .pager__btn:disabled { opacity: .45; cursor: not-allowed; }
    .pager__info { font-size: 12.5px; color: var(--text-muted); margin-left: 6px; }
    .pager__gap { color: var(--text-subtle); padding: 0 2px; }

    @media (max-width: 720px) {
      .lib-row { flex-wrap: wrap; }
      .lib-row .titlewrap { flex: 1 1 100%; }
    }
  </style>
</head>

  </aside>

  <div class="app__main">
    <div class="main__scroll">
      <div class="main__inner main__inner--wide" style="padding: 26px 30px 40px">
        <div class="page-head">
          <h1>论文库</h1>
          <span class="count" id="libCount"></span>
        </div>
        <div class="page-sub">
          上传的 PDF 会自动解析章节结构、写入检索索引并查重。跟库里已有论文重复时，会先问你要保留哪一版。
        </div>

        <div class="panel">

            <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />
          </div>
          <div id="upStatus"></div>
          <div class="dup-box" id="dupBox" hidden></div>
        </div>

        <!-- 大类筛选：一条。原来「主题 / 领域 / 方向」三条并列，口径不同又互相叠加，
             用户看不懂也在筛选时踩空；现在只保留单层大类（app/buckets.py）。 -->
        <div class="topic-bar" id="bucketBar">
          <span class="topic-bar__label">分类</span>
        </div>
        <div class="bucket-hint">
          <span class="bucket-hint__text">分类由标题与摘要的关键词自动判定，判不中的进「待分类」。</span>
          <button class="btn-sm" id="bucketManageBtn" title="新建 / 改名 / 删除大类，并给单篇论文指定分类">管理分类</button>

  <!-- 分类管理弹窗：只在需要时创建，避免给正常浏览多塞一层 DOM -->
  <div class="bkmask" id="bucketMask" hidden>
    <div class="bkpanel" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
      <div class="bkpanel__head">
        <strong id="bkTitle">管理分类</strong>
        <button class="btn-sm" id="bkClose" title="关闭">关闭</button>
      </div>
      <div class="bkpanel__body">
        <div class="bkhint">
          内置 7 类可以改名、不能删除；自建的类可以删除，删掉后里面的论文自动回到「待分类」，不会丢。
          所有改动会写进服务端，刷新页面仍然生效。
        </div>
        <div id="bkMsg" class="bkmsg" hidden></div>
        <table class="bktable">
          <thead><tr><th>分类</th><th>篇数</th><th>类型</th><th>操作</th></tr></thead>
          <tbody id="bkRows"></tbody>
        </table>
        <div class="bkadd">
          <input id="bkNewName" type="text" maxlength="20" placeholder="新分类名（最多 20 字）" />
          <button class="btn-sm btn-primary" id="bkAddBtn">新建分类</button>
        </div>
      </div>
    </div>
  </div>

  <script src="sidebar.js?v=20261031mobile"></script>
  <script>
    const libListEl = document.getElementById('libList');
    const libCountEl = document.getElementById('libCount');
    const dropZoneEl = document.getElementById('dropZone');
    const fileInputEl = document.getElementById('fileInput');
    const upStatusEl = document.getElementById('upStatus');
    const dupBoxEl = document.getElementById('dupBox');
    const bucketBarEl = document.getElementById('bucketBar');
    const pagerEl = document.getElementById('pager');

    // 分页与大类筛选状态。page 从 1 开始；curBucket 用 '' 表示不筛（全部）。
    const ALL_BUCKET = '';
    let allPapers = [];        // /papers 的原始结果（含 bucket 字段）
    let pageSize = 12;
    let curPage = 1;
    let curBucket = ALL_BUCKET;
    let bucketData = null;     // /papers/classify 的结果
    let bucketNames = [];      // /buckets 返回的大类名单（含用户自建类）
    let bucketInfo = [];       // /buckets 的完整条目：[{name, count, builtin}]

    let pendingDups = [];

    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtSize(n) {
      if (!n) return '0 B';
      if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
      return Math.round(n / 1024) + ' KB';
    }

    /** 去重后的论文数：同名文件（同一篇的不同副本）只算一篇。
     *
     * 列表行数是「记录数」，含副本；筛选条上的 chip 数字是「论文数」，去重。
     * 两个口径都真实存在，混在一根筛选条上会让人以为数字对不上 ——
     * 所以筛选条统一用去重口径，并在列表上方保留「共 N 篇」的记录数。
     */
    function countPapers(list) {
      return new Set(list.map(p => p.filename)).size;
    }

    /** 当前大类下的论文。'' 就是全部。
     *
     * 大类来自 /papers 的每条记录的 bucket 字段（后端 app/buckets.py 现算的），
     * 不再有「主题 / 领域 / 方向」三个互相叠加的筛子。
     */
    function papersOfBucket() {
      let list = allPapers;
      if (curBucket !== ALL_BUCKET) list = list.filter(p => (p.bucket || '') === curBucket);
      return list;
    }

    /** 每个大类的篇数（去重口径）。
     *
     * 为什么现算而不用 /papers/classify 下发的 count：那里面是**记录数**（含副本），
     * 而列表行数也是记录数、chip 上要的是篇数——两套口径混在一根条上会让人以为对不上。
     * 这里统一按 filename 去重。
     */
    function bucketCounts() {
      const pending = (bucketData && bucketData.pending) || '待分类';
      const keyOf = p => p.bucket || pending;
      const out = new Map();
      bucketNames.forEach(n => out.set(n, 0));
      const seen = new Set();
      allPapers.forEach(p => {
        if (seen.has(p.filename)) return;
        seen.add(p.filename);
        const k = keyOf(p);
        out.set(k, (out.get(k) || 0) + 1);
      });
      return out;
    }

    /** 唯一一条分类筛选条：全部 / 各大类（带篇数）。
     *
     * 「待分类」用虚线边框：它是"证据不足"的兜底桶，不是分类结论。
     */
    function renderBucketBar() {
      if (!bucketBarEl) return;
      const counts = bucketCounts();
      const pending = (bucketData && bucketData.pending) || '待分类';
      const parts = [`<span class="topic-bar__label">分类</span>`];
      const total = countPapers(allPapers);
      parts.push(
        `<button class="topic-chip${curBucket === ALL_BUCKET ? ' on' : ''}" data-bucket="">全部` +
        `<span class="topic-chip__n">${total}</span></button>`
      );
      bucketNames.forEach(name => {
        const on = curBucket === name ? ' on' : '';
        const extra = name === pending ? ' topic-chip--pending' : '';
        parts.push(
          `<button class="topic-chip${on}${extra}" data-bucket="${escapeHtml(name)}" ` +
          `title="${escapeHtml(name)}">${escapeHtml(name)}` +
          `<span class="topic-chip__n">${counts.get(name) || 0}</span></button>`
        );
      });
      parts.push(
        `<span class="topic-chip__n" style="margin-left:4px">当前 ${countPapers(papersOfBucket())} 篇</span>`
      );
      bucketBarEl.innerHTML = parts.join('');
      bucketBarEl.querySelectorAll('[data-bucket]').forEach(btn => {
        btn.addEventListener('click', () => {
          const next = btn.dataset.bucket;
          if (next === curBucket) return;
          curBucket = next;
          curPage = 1;              // 换大类回到第一页
          renderBucketBar();
          renderList();
          renderPager();
          scrollToListTop();
        });
      });
    }

    /**
     * 把当前主题下的论文按「主版本 + 副本」聚合成行。
     *
     * 为什么要在前端聚合：`duplicate_of` 指向的主版本不一定排在副本前面，
     * 分页又是按扁平列表切的，于是会出现"第 1 页三条重复副本、主版本在第 4 页"
     * 的情况——评委翻到第 1 页只看到三条一样的"重复"，找不到谁是真身。
     * 聚合之后分页按"组"切，主版本和它的副本永远在同一页。
     *
     * 返回 [{keeper, dups: [...]}],keeper 是主版本，dups 是它的所有副本。
     */
    function groupsOfTopic() {
      const list = papersOfBucket();

      // 同一份物理文件可能被索引登记了两次（历史遗留：早期条目用「文件名 stem」
      // 当 paper_id，后来改成「内容哈希」，两套 id 体系共存）。实测
      // 1706.03762v7.pdf 在 index.json 里有 bdfaa68d8984 与 1706.03762v7 两条，
      // 直接渲染就会出现两行同名的 1706.03762v7.pdf。这里按 filename 折一次：
      // 保留被别的记录指认成主版本的那条，其次是「文件名 stem == paper_id」那类
      // 老条目，最后才是其余；副本信息在合并时并到一起，不丢任何一行。
      const claimed = new Set(list.map(p => p.duplicate_of).filter(Boolean));
      const rank = p => {
        const stem = p.filename.replace(/\.pdf$/i, '');
        if (!p.duplicate_of && claimed.has(p.paper_id)) return 0;   // 真主版本
        if (p.paper_id === stem) return 1;                           // 老式条目
        return 2;
      };
      const byName = new Map();      // filename -> 排序后留下的那条
      list.forEach(p => {
        const cur = byName.get(p.filename);
        if (!cur || rank(p) < rank(cur)) byName.set(p.filename, p);
      });
      const kept = Array.from(byName.values());

      const byId = new Map(kept.map(p => [p.paper_id, p]));
      const isKeeper = new Map();
      kept.forEach(p => {
        isKeeper.set(
          p.paper_id,
          !p.duplicate_of && p.paper_id !== '' && claimed.has(p.paper_id),
        );
      });

      const dupsOf = new Map();     // keeperId -> [副本...]
      const keepers = [];
      kept.forEach(p => {
        const target = p.duplicate_of;
        // 副本挂到主版本名下，必须满足两条：目标在本次列表里、且目标确实是主版本
        if (target && byId.has(target) && isKeeper.get(target)) {
          if (!dupsOf.has(target)) dupsOf.set(target, []);
          dupsOf.get(target).push(p);
        } else {
          // 没有重复标记，或主版本不在当前筛选范围内（这时副本自己当一行，不能凭空消失）
          keepers.push(p);
        }
      });
      return keepers.map(k => ({ keeper: k, dups: dupsOf.get(k.paper_id) || [] }));
    }

    /** 当前页要显示的组。页码越界时自动夹回来。 */
    function groupsOfPage() {
      const groups = groupsOfTopic();
      const pages = Math.max(1, Math.ceil(groups.length / pageSize));
      if (curPage > pages) curPage = pages;
      if (curPage < 1) curPage = 1;
      const start = (curPage - 1) * pageSize;
      return groups.slice(start, start + pageSize);
    }

    /** 当前页要显示的那一条切。页码越界时自动夹回来。 */
    function papersOfPage() {
      const list = papersOfBucket();
      const pages = Math.max(1, Math.ceil(list.length / pageSize));
      if (curPage > pages) curPage = pages;
      if (curPage < 1) curPage = 1;
      const start = (curPage - 1) * pageSize;
      return list.slice(start, start + pageSize);
    }

    /** 页码序列：1 … 4 5 [6] 7 8 … 10。页数少时全列。 */
    function pageNumbers(cur, pages) {
      if (pages <= 7) return Array.from({ length: pages }, (_, i) => i + 1);
      const set = new Set([1, pages, cur, cur - 1, cur + 1]);
      if (cur <= 3) [2, 3, 4].forEach(n => set.add(n));
      if (cur >= pages - 2) [pages - 1, pages - 2, pages - 3].forEach(n => set.add(n));
      const nums = [...set].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
      const out = [];
      nums.forEach((n, i) => {
        if (i && n - nums[i - 1] > 1) out.push('gap');
        out.push(n);
      });
      return out;
    }

    function renderPager() {
      // 分页按「组」算：重复副本不单独占页位，跟着主版本一起显示
      const groups = groupsOfTopic();
      const pages = Math.max(1, Math.ceil(groups.length / pageSize));
      if (!groups.length) { pagerEl.innerHTML = ''; return; }
      const parts = [];
      parts.push(`<button class="pager__btn" data-page="prev" ${curPage <= 1 ? 'disabled' : ''}>上一页</button>`);
      pageNumbers(curPage, pages).forEach(n => {
        if (n === 'gap') { parts.push('<span class="pager__gap">…</span>'); return; }
        parts.push(`<button class="pager__btn${n === curPage ? ' on' : ''}" data-page="${n}">${n}</button>`);
      });
      parts.push(`<button class="pager__btn" data-page="next" ${curPage >= pages ? 'disabled' : ''}>下一页</button>`);
      parts.push(`<span class="pager__info">第 ${curPage} / ${pages} 页 · 每页 ${pageSize} 篇</span>`);
      pagerEl.innerHTML = parts.join('');
      pagerEl.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          const v = btn.dataset.page;
          const total = Math.max(1, Math.ceil(groupsOfTopic().length / pageSize));
          const next = v === 'prev' ? curPage - 1 : v === 'next' ? curPage + 1 : Number(v);
          if (next < 1 || next > total || next === curPage) return;
          curPage = next;
          renderList();
          renderPager();
          scrollToListTop();
        });
      });
    }

    /** 翻页只把列表区滚回可见位置，不整页跳。 */
    function scrollToListTop() {
      if (!bucketBarEl) return;
      const rect = bucketBarEl.getBoundingClientRect();
      // 已经可见就不动，避免每次翻页屏幕抖一下
      if (rect.top < 0 || rect.top > 120) {
        bucketBarEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }

    

    /**
     * 渲染一行的主体（标题、页数、徽标、操作按钮）。
     * 主版本和展开后的副本共用这套，只是徽标和缩进不同。
     */
    function rowHtml(p, opts) {
      const o = opts || {};
      // 有真实标题就显示标题、文件名降级成副信息；没有就退回文件名。
      // 标题被截断过时，悬停显示完整标题；否则悬停显示文件名。
      const hasTitle = !!(p.display_title && p.display_title !== p.filename);
      const primary = hasTitle ? p.display_title : p.filename;
      const titleAttr = (hasTitle && p.title_truncated) ? p.title : p.filename;
      return `
          <div class="lib-row${o.isSub ? ' lib-row--sub' : ''}">
            <div class="titlewrap">
              <div class="name" title="${escapeHtml(titleAttr)}">${escapeHtml(primary)}</div>
              <div class="file">${escapeHtml(p.filename)}</div>
            </div>
            <div class="meta">${p.pages || '?'} 页 · ${fmtSize(p.size)}</div>
            ${o.badge || ''}
            <div class="act">
              <a href="reader.html?paper=${encodeURIComponent(p.filename)}&page=1" target="_blank" rel="noopener">阅读</a>
              <button class="btn-sm" data-assign="${escapeHtml(p.filename)}"
                      title="给这篇人工指定分类；选「待分类」= 恢复自动判定">分类</button>
              <button class="btn-sm btn-danger" data-del="${escapeHtml(p.paper_id)}">删除</button>
            </div>
          </div>`;
    }

    /** 只重绘列表区：主题栏和分页器各自管自己，避免互相触发。 */
    function renderList() {
      const list = papersOfBucket();
      if (!allPapers.length) {
        libListEl.innerHTML = '<div class="empty">论文库还是空的，先在上面拖一份 PDF 进来。</div>';
        pagerEl.innerHTML = '';
        return;
      }
      if (!list.length) {
        // 分类筛空时要跟着当前大类说，否则用户以为论文丢了
        const scope = curBucket ? `「${curBucket}」分类` : '当前范围';
        libListEl.innerHTML = `<div class="empty">${escapeHtml(scope)}下没有论文，换一个看看。</div>`;
        pagerEl.innerHTML = '';
        return;
      }

      const sameName = new Map();
      allPapers.forEach(p => sameName.set(p.filename, (sameName.get(p.filename) || 0) + 1));

      libListEl.innerHTML = groupsOfPage().map(({ keeper, dups }) => {
        const dupId = sameName.get(keeper.filename) > 1
          ? `<span class="cited">${escapeHtml(keeper.paper_id)}</span>` : '';
        const badge = dups.length
          ? '<span class="pill keep" title="同一篇论文的多份拷贝里，这份是要保留的">主版本</span>'
          : (keeper.duplicate_of
              // 主版本不在当前主题里时，副本自己成一行，仍要标出它重复的是谁
              ? `<span class="pill dup" title="${escapeHtml(keeper.duplicate_reason || '与库中论文重复')}">重复副本 · 保留 ${escapeHtml(keeper.duplicate_of)}</span>`
              : '<span class="pill ok">已入库</span>');
        if (!dups.length) return rowHtml(keeper, { badge });

        // 有副本：主版本下面挂一个可展开的分组，默认收起
        const subRows = dups.map(d => {
          // 同名同大小 = 同一个文件被重新上传过一次。这种副本点开看到的内容
          // 和主版本一模一样，不说明一句，评委会以为是重复入库的 bug。
          const sameFile = d.filename === keeper.filename && d.size === keeper.size;
          const tip = sameFile ? '同一个文件重新上传过，内容和主版本相同' : (d.duplicate_reason || '与主版本重复');
          return rowHtml(d, {
            isSub: true,
            badge: `<span class="pill dup" title="${escapeHtml(tip)}">${sameFile ? '同文件重传' : '副本'}</span>`,
          });
        }).join('');
        return `
          <div class="dup-group">
            ${rowHtml(keeper, { badge })}
            <button class="dup-toggle" data-dup-toggle="1" aria-expanded="false">
              <span class="dup-toggle__caret">▸</span>
              已合并 ${dups.length} 份副本<span class="dup-toggle__hint">（同篇论文的其他版本，点开查看）</span>
            </button>
            <div class="dup-sub" hidden>${subRows}</div>
          </div>`;
      }).join('');

      libListEl.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', () => deletePaper(btn.dataset.del, btn));
      });
      libListEl.querySelectorAll('[data-assign]').forEach(btn => {
        btn.addEventListener('click', () => pickBucketFor(btn.dataset.assign, btn));
      });
      libListEl.querySelectorAll('.dup-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const box = btn.nextElementSibling;
          const open = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', open ? 'false' : 'true');
          btn.querySelector('.dup-toggle__caret').textContent = open ? '▸' : '▾';
          if (box) box.hidden = open;
        });
      });
    }

    async function loadLibrary() {
      libListEl.innerHTML = '<div class="empty">加载中…</div>';
      pagerEl.innerHTML = '';
      try {
        // 三个接口并行：/papers 给每篇的完整信息（含 bucket 大类），
        // /buckets 给大类名单与每类篇数（含用户自建类），
        // /papers/classify 给分类兜底口径（「待分类」的名字与总数）
        const [d, bk, c] = await Promise.all([
          fetch('/papers').then(r => r.json()),
          fetch('/buckets').then(r => r.json()).catch(() => null),
          fetch('/papers/classify').then(r => r.json()).catch(() => null),
        ]);
        allPapers = d.papers || [];
        libCountEl.textContent = `共 ${countPapers(allPapers)} 篇` +
          (allPapers.length !== countPapers(allPapers)
            ? `（${allPapers.length} 条记录，含重复副本）` : '');

        // 大类名单接口挂了也不能让论文列表跟着挂：退化成「全部」一条
        bucketNames = (bk && Array.isArray(bk.buckets)) ? bk.buckets.map(b => b.name) : [];
        if (!bucketNames.length) {
          upStatusEl.textContent = '分类暂不可用，已按全部论文展示。';
        }
        bucketData = (c && Array.isArray(c.buckets)) ? c : null;
        // 上次选的大类可能因为改名/删类没了，回落到「全部」
        if (curBucket !== ALL_BUCKET && !bucketNames.includes(curBucket)) {
          curBucket = ALL_BUCKET;
          curPage = 1;
        }
        renderBucketBar();
        renderList();
        renderPager();
      } catch (e) {
        libListEl.innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
      }
    }

    async function deletePaper(paperId, btn) {
      if (!confirm('确定删除这篇论文？原件、解析结构与检索索引会一起清掉。')) return;
      btn.disabled = true;
      try {
        const resp = await fetch('/papers/' + encodeURIComponent(paperId), { method: 'DELETE' });
        const d = await resp.json().catch(() => ({}));
        // 删除是管理员操作：没登录就跳登录页，登录完回到本页
        if (resp.status === 401 || resp.status === 503) {
          location.href = 'admin-login.html?next=' + encodeURIComponent(location.pathname);
          return;
        }
        if (!resp.ok) throw new Error(d.detail || ('HTTP ' + resp.status));
        upStatusEl.textContent = `已删除，清理索引块 ${d.removed_chunks || 0} 个。`;
        await loadLibrary();
      } catch (e) {
        upStatusEl.textContent = '删除失败：' + e.message;
        btn.disabled = false;
      }
    }

    async function uploadFiles(files) {
      const list = Array.from(files || []).filter(f => /\.pdf$/i.test(f.name));
      if (!list.length) { upStatusEl.textContent = '只支持 PDF 文件。'; return; }

      const fd = new FormData();
      list.forEach(f => fd.append('files', f));
      upStatusEl.textContent = `正在上传 ${list.length} 个文件…`;
      dupBoxEl.hidden = true;
      pendingDups = [];

      try {
        const resp = await fetch('/papers/upload', { method: 'POST', body: fd });
        const d = await resp.json();
        if (!resp.ok) throw new Error(d.detail || ('HTTP ' + resp.status));

        const lines = [];
        (d.results || []).forEach(r => {
          if (r.error) lines.push(`✗ ${r.filename}：${r.error}`);
          else if (r.index_ok === false) {
            // 文件进库了但搜不到内容：必须和"成功"分开说，否则用户以为能问答
            lines.push(`⚠ ${r.filename}（${r.paper.pages} 页，已保存但未入库：${r.index_error}）`);
          }
          else lines.push(`✓ ${r.filename}（${r.paper.pages} 页，索引 ${r.indexed} 块）`);
        });
        upStatusEl.textContent = lines.join('\n');
        pendingDups = (d.results || []).filter(r => r.duplicate).map(r => ({
          newName: r.filename,
          newId: r.paper.paper_id,
          ...r.duplicate,
        }));
        if (pendingDups.length) renderDups();
        await loadLibrary();
      } catch (e) {
        upStatusEl.textContent = '上传失败：' + e.message;
      }
    }

    function renderDups() {
      dupBoxEl.hidden = false;
      dupBoxEl.innerHTML = `<h3>发现 ${pendingDups.length} 处重复，请选择保留哪一版</h3>`;
      pendingDups.forEach((dup, i) => {
        const verText = dup.old_version && dup.new_version
          ? `（库中 v${dup.old_version} → 新上传 v${dup.new_version}${dup.newer ? '，新版' : '，旧版'}）`
          : '';
        const row = document.createElement('div');
        row.className = 'dup-row';
        row.innerHTML = `
          <div>《${escapeHtml(dup.newName)}》 与库中《${escapeHtml(dup.filename)}》重复
            —— 依据：${escapeHtml(dup.reason)}，相似度 ${dup.score} ${verText}</div>
          <div class="choices">
            <label><input type="radio" name="dup${i}" value="keep-new" ${dup.newer || !dup.old_version ? 'checked' : ''}>保留新版，删除旧版</label>
            <label><input type="radio" name="dup${i}" value="keep-both" ${dup.newer || !dup.old_version ? '' : 'checked'}>两个都留</label>
            <label><input type="radio" name="dup${i}" value="keep-old">保留旧版，删除刚上传的</label>
          </div>`;
        dupBoxEl.appendChild(row);
      });
      const apply = document.createElement('button');
      apply.className = 'btn-sm btn-primary';
      apply.textContent = '按选择处理';
      apply.addEventListener('click', applyDups);
      dupBoxEl.appendChild(apply);
    }

    async function applyDups() {
      const done = [];
      for (let i = 0; i < pendingDups.length; i += 1) {
        const dup = pendingDups[i];
        const choice = (dupBoxEl.querySelector(`input[name="dup${i}"]:checked`) || {}).value || 'keep-both';
        if (choice === 'keep-new') {
          const r = await fetch('/papers/' + encodeURIComponent(dup.paper_id), { method: 'DELETE' });
          done.push(r.ok ? `已删除旧版 ${dup.filename}` : `删除旧版失败（HTTP ${r.status}）`);
        } else if (choice === 'keep-old') {
          const r = await fetch('/papers/' + encodeURIComponent(dup.newId), { method: 'DELETE' });
          done.push(r.ok ? `已删除新版 ${dup.newName}` : `删除新版失败（HTTP ${r.status}）`);
        } else {
          done.push(`保留两版：${dup.newName} / ${dup.filename}`);
        }
      }
      upStatusEl.textContent = done.join('\n');
      dupBoxEl.hidden = true;
      pendingDups = [];
      await loadLibrary();
    }

    document.getElementById('pickFiles').addEventListener('click', () => fileInputEl.click());
    fileInputEl.addEventListener('change', () => {
      uploadFiles(fileInputEl.files);
      fileInputEl.value = '';
    });
    ['dragenter', 'dragover'].forEach(ev => dropZoneEl.addEventListener(ev, e => {
      e.preventDefault();
      dropZoneEl.classList.add('hot');
    }));
    ['dragleave', 'drop'].forEach(ev => dropZoneEl.addEventListener(ev, e => {
      e.preventDefault();
      dropZoneEl.classList.remove('hot');
    }));
    dropZoneEl.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));

    // ---------------------------------------------------------------- 分类管理
    //
    // 五个操作都走同一个 request()，统一处理 401/503 跳登录、400 显示服务端原因。
    // 服务端 app/buckets.py 用 ValueError 表达「重名 / 不许删内置类」，
    // 这些原因要原样给用户看 —— 只说「失败」等于没说。

    const bucketMaskEl = document.getElementById('bucketMask');
    const bkRowsEl = document.getElementById('bkRows');
    const bkMsgEl = document.getElementById('bkMsg');
    const bkNewNameEl = document.getElementById('bkNewName');

    function bkShow(text, isErr) {
      if (!text) { bkMsgEl.hidden = true; bkMsgEl.textContent = ''; return; }
      bkMsgEl.hidden = false;
      bkMsgEl.textContent = text;
      bkMsgEl.classList.toggle('err', !!isErr);
    }

    async function bucketRequest(url, body) {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (resp.status === 401 || resp.status === 503) {
        location.href = 'admin-login.html?next=' + encodeURIComponent(location.pathname);
        return null;
      }
      let data = {};
      try { data = await resp.json(); } catch (e) { /* 非 JSON 就按 HTTP 码报 */ }
      if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
      return data;
    }

    /** 重新拉 /buckets 与 /papers，把弹窗表格和筛选条一起刷新。 */
    async function refreshBuckets() {
      const [bk, d] = await Promise.all([
        fetch('/buckets').then(r => r.json()).catch(() => null),
        fetch('/papers').then(r => r.json()).catch(() => null),
      ]);
      bucketNames = (bk && Array.isArray(bk.buckets)) ? bk.buckets.map(b => b.name) : [];
      bucketInfo = (bk && Array.isArray(bk.buckets)) ? bk.buckets : [];
      if (d) allPapers = d.papers || [];
      if (curBucket !== ALL_BUCKET && !bucketNames.includes(curBucket)) curBucket = ALL_BUCKET;
      renderBucketBar();
      renderList();
      renderPager();
      renderBucketRows();
    }

    function renderBucketRows() {
      const pending = (bucketData && bucketData.pending) || '待分类';
      const counts = bucketCounts();
      bkRowsEl.innerHTML = bucketInfo.map(b => {
        const isPending = b.name === pending;
        const canDelete = !b.builtin && !isPending;
        return `<tr data-name="${escapeHtml(b.name)}">
          <td>${escapeHtml(b.name)}</td>
          <td class="n">${counts.get(b.name) || 0}</td>
          <td><span class="bktag">${b.builtin ? '内置' : (isPending ? '兜底' : '自建')}</span></td>
          <td class="ops">${isPending ? '<span class="bktag">不可改</span>' : `
            <button class="btn-sm" data-act="rename">改名</button>
            ${canDelete ? '<button class="btn-sm" data-act="delete">删除</button>' : ''}`}
          </td>
        </tr>`;
      }).join('');
      bkRowsEl.querySelectorAll('tr[data-name]').forEach(tr => {
        const name = tr.dataset.name;
        tr.querySelectorAll('[data-act]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (btn.dataset.act === 'rename') renameBucket(name);
            else deleteBucket(name);
          });
        });
      });
    }

    async function renameBucket(name) {
      const next = prompt(`把「${name}」改成：`, name);
      if (next === null) return;
      if (!next.trim() || next.trim() === name) return;
      try {
        await bucketRequest('/buckets/rename', { old: name, new: next.trim() });
        await refreshBuckets();
        bkShow(`已改名为「${next.trim()}」。`);
      } catch (e) { bkShow(e.message, true); }
    }

    async function deleteBucket(name) {
      const counts = bucketCounts();
      const n = counts.get(name) || 0;
      const ok = confirm(
        `确定删除分类「${name}」？\n\n` +
        `里面的 ${n} 篇论文不会丢，会回到「待分类」，你可以再手动指一个分类。`
      );
      if (!ok) return;
      try {
        await bucketRequest('/buckets/delete', { name });
        await refreshBuckets();
        bkShow(`已删除「${name}」，其中论文已回到「待分类」。`);
      } catch (e) { bkShow(e.message, true); }
    }

    async function addBucket() {
      const name = (bkNewNameEl.value || '').trim();
      if (!name) { bkShow('分类名不能为空。', true); return; }
      try {
        await bucketRequest('/buckets', { name });
        bkNewNameEl.value = '';
        await refreshBuckets();
        bkShow(`已新建「${name}」。要放论文进去，在列表里点那篇的「指定分类」。`);
      } catch (e) { bkShow(e.message, true); }
    }

    document.getElementById('bucketManageBtn').addEventListener('click', async () => {
      bucketMaskEl.hidden = false;
      bkShow('');
      try {
        await refreshBuckets();
      } catch (e) { bkShow('加载分类失败：' + e.message, true); }
    });
    document.getElementById('bkClose').addEventListener('click', () => { bucketMaskEl.hidden = true; });
    bucketMaskEl.addEventListener('click', e => {
      if (e.target === bucketMaskEl) bucketMaskEl.hidden = true;
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !bucketMaskEl.hidden) bucketMaskEl.hidden = true;
    });
    document.getElementById('bkAddBtn').addEventListener('click', addBucket);
    bkNewNameEl.addEventListener('keydown', e => { if (e.key === 'Enter') addBucket(); });

    /** 给单篇论文指定分类。传「待分类」等于撤销人工指定，回到自动判定。 */
    async function assignBucket(filename, target) {
      try {
        await bucketRequest('/buckets/assign', { filename, bucket: target });
        await refreshBuckets();
        return true;
      } catch (e) {
        upStatusEl.textContent = '指定分类失败：' + e.message;
        return false;
      }
    }

    /** 点列表行上的「分类」按钮：在弹出的选项里挑一个大类。
     *
     * 用 prompt 而不是自建下拉，是因为这里只需要「选一个已知项」，
     * 自建下拉要做键盘导航、点外关闭、滚动定位，成本远高于收益；
     * 真按错了再点一次就行，不会造成数据丢失。
     */
    async function pickBucketFor(filename, btn) {
      const names = bucketNames.filter(Boolean);
      if (!names.length) { upStatusEl.textContent = '分类名单还没加载出来，刷新页面再试。'; return; }
      const hint = names.map((n, i) => `${i + 1}. ${n}`).join('\n');
      const ans = prompt(`把 ${filename} 归到哪一类？输入序号：\n\n${hint}`, '');
      if (ans === null) return;
      const idx = parseInt(ans, 10);
      if (!Number.isInteger(idx) || idx < 1 || idx > names.length) {
        upStatusEl.textContent = '序号不对，没做改动。';
        return;
      }
      btn.disabled = true;
      const ok = await assignBucket(filename, names[idx - 1]);
      btn.disabled = false;
      if (ok) upStatusEl.textContent = `已把 ${filename} 归到「${names[idx - 1]}」。`;
    }

    loadLibrary();
  </script>
</body>
</html>
