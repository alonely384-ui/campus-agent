<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Agent</title>
  <!-- 故意不用 React/Vue：第 3 周的目标是"能公网访问"，
       不是"前端写得漂亮"。等核心功能稳了再考虑换框架。 -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; height: 100vh; display: flex;
      flex-direction: column; align-items: center;
    }
    header { width: 100%; max-width: 820px; padding: 20px 16px 12px; }
    h1 { font-size: 18px; color: #1a1a1a; }
    .status { font-size: 12px; color: #888; margin-top: 4px; }
    .status.ok { color: #14a44d; }
    .status.bad { color: #dc3545; }

    #chat {
      flex: 1; width: 100%; max-width: 820px; overflow-y: auto;
      padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px;
           line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .user { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 3px; }
    .bot  { align-self: flex-start; background: #fff; color: #222;
            border-bottom-left-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .trace { align-self: flex-start; font-size: 12px; color: #6b7280;
             background: #eef1f5; border-radius: 8px; padding: 8px 12px;
             font-family: Consolas, monospace; max-width: 82%; white-space: pre-wrap; }
    .err { align-self: center; color: #dc3545; font-size: 13px; }

    footer { width: 100%; max-width: 820px; padding: 12px 16px 20px; display: flex; gap: 8px; }
    #q { flex: 1; padding: 12px 14px; border: 1px solid #d5d9e0; border-radius: 10px;
         font-size: 15px; outline: none; }
    #q:focus { border-color: #1a73e8; }
    button { padding: 12px 22px; border: none; border-radius: 10px;
             background: #1a73e8; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { background: #a9c3e8; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Campus Agent</h1>
    <div class="status" id="status">检查服务状态…</div>
  </header>

  <div id="chat">
    <div class="msg bot">你好！我是校园助手。试着问我：<br />· 23*47 等于多少<br />· 帮我算一下 (128+72)/4</div>
  </div>

  <footer>
    <input id="q" placeholder="输入你的问题，回车发送…" autocomplete="off" />
    <button id="send">发送</button>
  </footer>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('q');
const sendEl = document.getElementById('send');
const statusEl = document.getElementById('status');

// ---------- 健康检查：确认后端活着 ----------
fetch('/health')
  .then(r => r.json())
  .then(d => {
    statusEl.textContent = `服务正常 · 模型 ${d.model} · v${d.version}`;
    statusEl.className = 'status ok';
  })
  .catch(() => {
    statusEl.textContent = '无法连接后端服务';
    statusEl.className = 'status bad';
  });

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// ---------- 核心：消费 SSE 流 ----------
async function send() {
  const question = inputEl.value.trim();
  if (!question) return;

  inputEl.value = '';
  sendEl.disabled = true;
  addMsg(question, 'user');

  const botEl = addMsg('', 'bot');
  let traceEl = null;
  let answer = '';

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question, history: [] }),
    });

    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + (await resp.text()).slice(0, 200));

    // 逐块读取响应体 —— 这就是"流式"在前端的样子
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 用空行分隔每条事件
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;

        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (ev.type === 'answer_delta') {
          answer += ev.text;
          botEl.textContent = answer;
        } else if (ev.type === 'tool_call') {
          traceEl = traceEl || addMsg('', 'trace');
          traceEl.textContent += `🔧 调用 ${ev.tool}(${ev.arguments})\n`;
        } else if (ev.type === 'tool_result') {
          traceEl = traceEl || addMsg('', 'trace');
          traceEl.textContent += `   ↳ ${ev.result}\n`;
        } else if (ev.type === 'error') {
          addMsg('服务出错：' + ev.message, 'err');
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    if (!answer) botEl.textContent = '（没有返回内容）';
  } catch (e) {
    addMsg('请求失败：' + e.message, 'err');
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
inputEl.focus();
</script>
</body>
</html>
