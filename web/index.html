<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科研小助手</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- 故意不用 React/Vue：第 3 周的目标是"能公网访问"，
       不是"前端写得漂亮"。等核心功能稳了再考虑换框架。 -->
  <!-- 全站设计系统：变量 + reset + 基础组件。必须在本页 <style> 之前，
       页面规则才能覆盖它。 -->
  <link rel="stylesheet" href="design-system.css" />
  <!-- 侧栏宽度要在首帧之前就填进 :root，否则会先按默认 264px 画一帧再跳到用户设的宽度。
       这段必须内联且放在样式表之后——独立 JS 文件会晚于首帧执行。 -->
  <script>
    (function () {
      try {
        var w = parseInt(localStorage.getItem('campus-agent-sidebar-w-v1') || '', 10);
        if (w >= 200 && w <= 520) {
          document.documentElement.style.setProperty('--sidebar-w', w + 'px');
        }
        // 对话正文宽度同理：右侧拖拽条拖到哪里，刷新后首帧就是这个宽度
        var cw = parseInt(localStorage.getItem('campus-agent-chat-w-v1') || '', 10);
        if (cw >= 520 && cw <= 1400) {
          document.documentElement.style.setProperty('--chat-w', cw + 'px');
        }
      } catch (e) { /* 隐私模式读不到 localStorage，用默认宽度 */ }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* 布局骨架（侧栏 / 主区 / 输入坞）在 design-system.css 的「侧栏布局组件」段，
       这里只管本页的消息气泡、证据卡、角色时间线与两个弹层。 */
    body { font-family: var(--font-sans); }

    #chat {
      /* 宽度交给父级 .main__inner 决定（它跟着 --chat-w 走）。
         这里再写 max-width 会因 id 选择器特性更高而把拖拽结果盖掉——
         2026-10-30 实测踩到：拖动时输入坞变宽了，答句却一直卡在 820px。 */
      flex: 1; width: 100%; overflow-y: auto;
      padding: 0; display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 82%; padding: 11px 15px; border-radius: var(--radius-card);
           line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .user { align-self: flex-end; background: var(--brand-grad); color: var(--text-on-brand);
            border-bottom-right-radius: 6px; box-shadow: 0 4px 14px rgba(26, 115, 232, .28); }
    .bot  { align-self: flex-start; background: var(--bg-surface); color: var(--text-primary);
            border: 1px solid var(--border-color); border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-card); }
    .trace { align-self: flex-start; font-size: 12px; color: var(--text-muted);
             background: var(--bg-muted); border-radius: var(--radius-control); padding: 8px 12px;
             font-family: var(--font-mono); max-width: 82%; white-space: pre-wrap; }
    .err { align-self: center; color: var(--danger); font-size: 13px; }

    /* 证据卡片：回答下方的"可核验"区块 —— 评委一眼能看到检索到了什么 */
    .evidence { align-self: flex-start; width: 82%; display: flex; flex-direction: column;
                gap: 8px; margin-top: -4px; }
    .ev { background: var(--bg-surface); border: 1px solid var(--border-color);
          border-left: 3px solid var(--brand);
          border-radius: var(--radius-control); padding: 11px 13px; box-shadow: var(--shadow-card); }
    .ev.miss { border-left-color: var(--danger); }
    .ev-head { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .ev-head b { color: var(--brand); font-weight: 600; }
    .ev-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-top: 6px;
               max-height: 96px; overflow: hidden; position: relative; cursor: pointer; }
    .ev-text.open { max-height: none; }
    .ev-badge { font-size: 11px; padding: 1px 6px; border-radius: var(--radius-sm); background: var(--bg-muted); color: var(--text-muted); }
    .ev-open { font-size: 11px; padding: 1px 8px; border-radius: var(--radius-sm); background: var(--brand);
               color: #fff; text-decoration: none; white-space: nowrap; }
    .ev-open:hover { background: var(--brand-active); }

    /* ---------- 角色时间线：四智能体协作过程可核验 ----------
       官方赛题「AI 技术深度」点名要「多智能体协同」。这里把 Planner/Retriever/
       Extractor/Verifier/Writer 每一步摊开，谁做了什么、花了多久，一眼能看到。 */
    .roles { align-self: flex-start; width: 82%; background: var(--bg-surface); border: 1px solid var(--border-color);
             border-radius: var(--radius-control); padding: 11px 13px; box-shadow: var(--shadow-card); }
    .roles-head { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px;
                  align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .roles-head b { color: var(--text-primary); font-size: 13px; font-weight: 600; }
    .role-status { font-size: 11px; padding: 2px 9px; border-radius: var(--radius-chip);
                   background: var(--success-bg); color: var(--success); font-family: var(--font-mono); }
    .role-list { display: flex; flex-direction: column; gap: 0; }
    .role { display: flex; gap: 10px; padding: 7px 0; position: relative; }
    .role + .role { border-top: 1px solid var(--border-color-alt); }
    /* 左侧圆点 + 竖线，画出"流水线"的视觉 */
    .role-dot { flex: 0 0 18px; display: flex; flex-direction: column; align-items: center; }
    .role-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
                  margin-top: 5px; display: block; }
    .role.fail .role-dot i { background: var(--danger); }
    .role-dot span { flex: 1; width: 2px; background: var(--border-color); margin-top: 3px; }
    .role:last-child .role-dot span { display: none; }
    .role-body { flex: 1; min-width: 0; }
    .role-title { font-size: 12px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .role-title b { color: var(--text-primary); font-weight: 600; }
    .role-ms { color: var(--text-subtle); font-size: 11px; font-variant-numeric: tabular-nums; }
    .role-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; margin-top: 2px;
                 word-break: break-word; }
    .role.fail .role-text { color: var(--danger); }

    /* 多选列表与输入坞的间距（.pick 的定位与外观在 design-system.css 的 .dock 段） */
    .pick { position: relative; }
    .pick > summary { list-style: none; cursor: pointer; white-space: nowrap; user-select: none; }
    .pick > summary::-webkit-details-marker { display: none; }
    .pick-list { position: absolute; left: 0; width: 360px; max-width: calc(100vw - 24px); max-height: 260px; overflow: auto;
                 background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-card);
                 box-shadow: var(--shadow-pop); padding: 6px; z-index: 10; }
    .pick-list label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; font-size: 13px;
                       border-radius: var(--radius-sm); cursor: pointer; }
    .pick-list label:hover { background: var(--bg-surface-2); }
    .pick-list input { margin: 0; }

    /* 对比表：模型输出 Markdown 表格时渲染成真正的表格 */
    /* 手机上表格容易挤爆，外面套一层横向滚动，表头吸顶、首列固定，长文自动换行 */
    .table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; border: 1px solid var(--border-color);
                  border-radius: var(--radius-control); background: var(--bg-surface); }
    table.cmp { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 520px; }
    table.cmp th, table.cmp td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
                                 padding: 8px 10px; text-align: left; vertical-align: top;
                                 line-height: 1.5; word-break: break-word; max-width: 260px; }
    table.cmp tr:last-child td { border-bottom: none; }
    table.cmp th:last-child, table.cmp td:last-child { border-right: none; }
    table.cmp tr:first-child th { background: var(--brand-soft); font-weight: 600;
                                  position: sticky; top: 0; z-index: 2;
                                  border-bottom: 2px solid var(--brand); }
    table.cmp td:first-child { background: var(--bg-surface-2); font-weight: 500; }
    table.cmp tbody tr:nth-child(even) td, table.cmp tr:nth-child(even) td { background: var(--gray-25); }
    table.cmp tr:hover td { background: var(--brand-soft); }
  </style>
</head>
<body class="app">
  <!-- 左侧栏：功能入口 + 对话历史。折叠状态记在 localStorage(is-collapsed) 里，
       刷新后保持，和 DeepSeek 官网一致。图标沿用系统里的符号，不引外部字体。 -->
  <aside class="sidebar" id="sidebar" aria-label="功能导航与对话历史">
    <div class="sb-head">
      <a class="sb-logo" href="index.html" title="科研小助手">
        <img class="sb-logo__mark" src="logo.svg" alt="" width="26" height="26">
        <span class="sb-logo__name">科研小助手</span>
      </a>
      <button class="sb-toggle" id="sbToggle" title="收起侧栏（Ctrl+Shift+B）" aria-label="收起侧栏">☰</button>
      <button class="sb-toggle sb-head-act" id="sbToggleAct" title="展开侧栏（Ctrl+Shift+B）" aria-label="展开侧栏">☰</button>
    </div>

    <button class="sb-new" id="newChat" title="清空当前对话，开启新的会话">

    </button>

    <div class="sb-group sb-group--nav">
      <a class="sb-item" id="openLib" href="library.html" title="上传、查看、删除论文（支持批量，自动查重）">
        <span class="sb-item__ico">▤</span><span class="sb-item__txt">论文库</span>

      </a>

         title="写作助手：框架生成、架构图、数据可视化、中译英（1.6）">

    <div class="sb-history" id="sbHistory"></div>

    <div class="sb-foot">
      <a class="sb-item" id="openSettings" href="settings.html"
         title="设置中心：模型、检索参数、定时刷新、知识库">
        <span class="sb-item__ico">⚙︎</span><span class="sb-item__txt">设置</span>
      </a>
    </div>

    <!-- 拖拽调宽：贴在右内边的透明抓手，拖动改 --sidebar-w，松手存 localStorage -->
    <div class="sb-resizer" id="sbResizer" title="拖动调整侧栏宽度（双击恢复默认）" role="separator"
         aria-orientation="vertical" aria-label="拖动调整侧栏宽度"></div>
  </aside>

  <!-- 抽屉遮罩：只在 900px 以下的窄屏生效，点它关闭侧栏抽屉 -->
  <div class="sb-mask" id="sbMask" aria-hidden="true"></div>

  <div class="app__main">
    <!-- 窄屏才显示：用来把侧栏抽屉拉出来。桌面端由 CSS 隐藏，标题栏衔接处常驻。 -->
    <button class="mnav-btn" id="mnavBtn" aria-label="打开导航菜单" title="导航菜单">
      <span aria-hidden="true">☰</span>
    </button>

    <div class="main__scroll" id="chatScroll">
      <div class="main__inner" id="chat"></div>
    </div>

    <!-- 输入坞：空状态时居中显示招呼语 + 大输入框，发第一句后立刻切成对话流 -->
    <div class="dock">
      <div class="dock__inner">
        <div class="greeting" id="greeting">
          <img class="greeting__mark" src="logo.svg" alt="" width="54" height="54">
          <div class="greeting__title">于阅读中积累，在探索中创新</div>
          <div class="greeting__sub">读论文、找原文、做对比——先勾选右上角的论文，再提问更准</div>
        </div>

        <div class="dock__box">
          <textarea class="dock__ta" id="q" rows="1"
                    placeholder="给科研小助手发送消息…（Enter 发送，Shift+Enter 换行）"
                    aria-label="输入你的问题"></textarea>
          <div class="dock__tools">
            <!-- 「深度思考」（多智能体协作）本来是每轮都跑的，做成开关会变成关不掉的假开关，
                 2026-10-30 直接删掉，别留着误导人。真开关只保留「智能搜索」。 -->
            <button class="chip-toggle on" id="chipSearch" type="button" aria-pressed="true"
                    title="智能搜索：开启 = 稠密语义 + BM25 关键词 + 哈希字面 三路召回；关闭 = 只用 BM25 + 哈希">
              <span class="chip-toggle__ico">◎</span>智能搜索
            </button>
            <span class="dock__spacer"></span>
            <details class="pick" id="pick">
              <summary id="pickSummary" title="勾 0 篇=全库检索；1 篇=单篇问答；2 篇以上=多篇对比">全部论文</summary>
              <div class="pick-list" id="pickList"></div>
            </details>
            <button class="icon-btn" id="pickFiles" type="button" title="上传 PDF 到论文库">📎</button>
            <button class="dock__send" id="send" type="button" title="发送" aria-label="发送">↑</button>
          </div>
        </div>

        <div class="status" id="status">检查服务状态…</div>
      </div>
    </div>

    <!-- 右侧竖向拖拽条：左右拖动改变对话正文的排版宽度（像 Harness 那样） -->
    <div class="main__resizer" id="mainResizer" title="拖动调整对话宽度（双击恢复默认）"
         role="separator" aria-orientation="vertical" aria-label="拖动调整对话宽度"></div>
  </div>

  <!-- 论文库 / 发现 已改成独立整页（library.html / discover.html），
       这里原来的两个弹层在 2026-10-30 移除：弹窗里放不下论文列表和推荐流，
       而且和其余五个整页页面交互不一致。 -->

<script src="sidebar.js?v=20261031mobile"></script>

<script>
const chatEl = document.getElementById('chat');
const chatScrollEl = document.getElementById('chatScroll');
const inputEl = document.getElementById('q');
const sendEl = document.getElementById('send');
const statusEl = document.getElementById('status');
const pickEl = document.getElementById('pick');
const pickListEl = document.getElementById('pickList');
const pickSummaryEl = document.getElementById('pickSummary');
// 开发期截图开关：在地址后加 ?sample=1 会往聊天区塞几条假消息，用来预览气泡/证据卡样式。
// 只在 URL 带参数时生效，平时恒为 false，不影响真实使用。
const UI_DEV_SAMPLE = new URLSearchParams(location.search).has('sample');

// ---------- 会话列表（左侧栏「对话历史」） ----------
// 结构：一个会话 = {id, title, createdAt, updatedAt, messages:[{role, content}]}
// 只存 localStorage，不落库——换浏览器/换设备看不到历史，是有意为之（不引入用户体系）。
//
// 这里有个容易踩的坑：HISTORY_KEY 原来存的是「当前那一轮对话」的扁平数组
// （{role, content} 直接排队），现在改成会话列表对象。老用户的浏览器里躺着旧格式，
// 如果直接按新格式解析会拿到 undefined 而让历史整块消失。所以 loadSessions()
// 会识别旧格式并把它包成一个会话迁移过来，迁移后立刻写回新格式。
const SESSIONS_KEY = 'campus-agent-sessions-v1';
const LEGACY_KEY = 'campus-agent-history-v1';   // 旧版扁平历史，只读迁移用
const HISTORY_MAX_MSGS = 12;     // 单会话保留的最大消息数（6 轮），喂给后端的上下文口径
const HISTORY_MAX_CHARS = 1000;  // 单条截断，防 token 越滚越大
const TITLE_MAX_CHARS = 20;      // 侧栏标题取第一个问题的前 N 个字
const SESSION_KEEP = 60;         // 本地最多留 60 个会话，再老的就丢掉，别把 localStorage 撑爆

function newSession() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title: '',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    messages: [],
  };
}

// 把一个会话里给后端用的历史裁到 HISTORY_MAX_MSGS 条、单条截断
function trimForApi(messages) {
  return messages.slice(-HISTORY_MAX_MSGS).map(m => ({
    role: m.role,
    content: String(m.content).slice(0, HISTORY_MAX_CHARS),
  }));
}

// 旧格式 [{role, content}] → 一个会话。旧数据本身可能超过 12 条，不裁——回看要完整。
function migrateLegacy() {
  try {
    const arr = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
    if (!Array.isArray(arr) || !arr.length) return null;
    const msgs = arr
      .filter(m => m && m.role && m.content)
      .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: String(m.content) }));
    if (!msgs.length) return null;
    const first = msgs.find(m => m.role === 'user');
    const s = newSession();
    s.messages = msgs;
    s.title = makeTitle(first ? first.content : msgs[0].content);
    s.createdAt = s.updatedAt = Date.now();
    return s;
  } catch (e) {
    return null;
  }
}

function loadSessions() {
  let list = [];
  try {
    const raw = localStorage.getItem(SESSIONS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sessions)) list = parsed.sessions;
    }
  } catch (e) {
    list = [];
  }
  let activeId = null;
  try {
    activeId = localStorage.getItem(SESSIONS_KEY + ':active') || null;
  } catch (e) {
    activeId = null;
  }

  const before = list.length;
  list = list.filter(s => s && s.id && Array.isArray(s.messages));
  // 空会话一律丢掉：一条消息都没有的会话在侧栏里只能显示成「未命名对话」，
  // 点进去是空白，纯噪音。历史上有两个来源会写出空壳（旧版「开启新对话」会把
  // 当前会话清空、流式失败后刷新），所以这里做一次兜底清理。
  // 注意必须把清理结果**写回 localStorage**：只在内存里过滤，刷新后脏数据还躺着，
  // 下次打开又冒出来（第一版就是这么漏的）。
  list = list.filter(s => s.messages.length > 0);
  list.forEach(s => {
    s.title = s.title || makeTitle((s.messages.find(m => m.role === 'user') || { content: '' }).content);
    s.createdAt = Number(s.createdAt) || Date.now();
    s.updatedAt = Number(s.updatedAt) || s.createdAt;
  });

  if (!list.length) {
    const legacy = migrateLegacy();
    if (legacy) {
      list = [legacy];
      activeId = legacy.id;
    }
  }

  list.sort((a, b) => b.updatedAt - a.updatedAt);
  list = list.slice(0, SESSION_KEEP);

  // 脏数据回写：条数发生变化或标题被补全时才写，避免每次加载都无谓改存储
  const dirty = before !== list.length || list.some(s => !s.title);
  if (dirty) {
    try {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify({ version: 2, sessions: list }));
      if (!list.some(s => s.id === activeId)) activeId = null;
      if (activeId) localStorage.setItem(SESSIONS_KEY + ':active', activeId);
      else localStorage.removeItem(SESSIONS_KEY + ':active');
    } catch (e) {
      // 存不下就当没清理，不影响本轮使用
    }
  }
  if (activeId && !list.some(s => s.id === activeId)) activeId = null;
  return { sessions: list, activeId };
}

function makeTitle(text) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  if (!t) return '未命名对话';
  return t.length > TITLE_MAX_CHARS ? t.slice(0, TITLE_MAX_CHARS) + '…' : t;
}

const store = loadSessions();
let sessions = store.sessions;
let activeId = store.activeId && sessions.some(s => s.id === store.activeId) ? store.activeId : null;

function activeSession() {
  return sessions.find(s => s.id === activeId) || null;
}

function saveSessions() {
  sessions.sort((a, b) => b.updatedAt - a.updatedAt);
  sessions = sessions.slice(0, SESSION_KEEP);
  try {
    localStorage.setItem(SESSIONS_KEY, JSON.stringify({ version: 2, sessions }));
    if (activeId) localStorage.setItem(SESSIONS_KEY + ':active', activeId);
    else localStorage.removeItem(SESSIONS_KEY + ':active');
    // 迁移成功就把旧格式清掉，避免下次又迁一遍、出现两条一模一样的记录
    localStorage.removeItem(LEGACY_KEY);
  } catch (e) {
    // 存不下（隐私模式 / 配额满）就算了，不打断提问
  }
}

// ---------- 会话切换 ----------
// 只重画文字气泡：证据卡片、协作时间线是那一轮实时算出来的，不持久化，
// 切回来时看不到是正常的（历史上重新拉一遍检索没意义，反而慢）。
function renderConversation(showFallback) {
  chatEl.innerHTML = '';
  const s = activeSession();
  const msgs = s ? s.messages : [];
  document.body.classList.toggle('has-conv', msgs.length > 0);

  if (!msgs.length) {
    if (showFallback) addMsg('新对话开始。试着问我：这篇论文训练用了多少块 GPU？', 'bot');
    document.body.classList.toggle('has-conv', showFallback);
    return;
  }
  msgs.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot'));
}

function startNewChat() {
  // 「开启新对话」= 严丝合缝地回到初始空状态，不碰任何已有会话。
  //
  // 这里曾经写成「把当前会话的 messages 清空」，结果是：用户已经问过的那个会话被
  // 原地清成空壳，标题也跟着清掉，刷新后侧栏冒出一条「未命名对话」，点开什么都没有。
  // 复现路径：提问 → 回答 → 点「开启新对话」→ 刷新（实测 B1 有 2 条消息，B2 变 0 条）。
  // 正确做法是只把"当前会话"指针置空，旧会话原样留在列表里。
  activeId = null;
  document.body.classList.remove('has-conv');
  chatEl.innerHTML = '';
  saveSessions();
  sbRenderHistory();
  inputEl.value = '';
  autoGrow();
  inputEl.focus();
}

// 首次进入：URL 带 ?c=<会话id> 就打开那条（侧栏的历史条目都是这么跳回来的），
// 否则有会话就画出来，没有就保持在「欢迎回来」空状态。
(function openFromUrl() {
  const wanted = new URLSearchParams(location.search).get('c');
  if (!wanted) return;
  if (sessions.some(s => s.id === wanted)) {
    activeId = wanted;
    saveSessions();
  }
  // 会话已经被删掉（比如在另一个标签页删的）就静默回到空状态，不弹框打扰
  history.replaceState(null, '', location.pathname);
})();

renderConversation(UI_DEV_SAMPLE);
sbRenderHistory();

// ?sample=1：塞几条假消息预览样式（仅开发期用，URL 不带参数时这段完全不执行）
if (UI_DEV_SAMPLE) {
  document.body.classList.add('has-conv');
  addMsg('Attention Is All You Need 的第 6 作者是谁？', 'user');
  const demoBot = addMsg('', 'bot');

    '（第 1 位 Ashish Vaswani 记为第 1 作者，按作者序号排下来第 6 位是 Noam Shazeer）。\n\n' +
    '下表是原论文前 8 位作者的信息，方便核对：\n\n' +
    '| 序号 | 姓名 | 单位 |\n|---|---|---|\n' +
    '| 1 | Ashish Vaswani | Google Brain |\n| 2 | Noam Shazeer | Google Brain |\n| 3 | Niki Parmar | Google Research |');
  renderEvidence(demoBot, [
    { rank: 1, page: 1, score: 0.9123, score_type: 'rerank', channels: ['dense', 'bm25'],
      source: '1706.03762v7.pdf', text: 'Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan N. Gomez, Łukasz Kaiser, Illia Polosukhin. Google Brain, Google Research, University of Toronto.' },
  ]);
}

// 论文多选：勾 0 篇 = 全库检索；勾 1 篇 = 单篇问答；勾 2 篇及以上 = 多篇对比
// 选择存 localStorage：刷新/换页后不清空，避免"勾了但没发出去"
const PICK_KEY = 'campus-agent-picks-v1';
function savedPicks() {
  try { return JSON.parse(localStorage.getItem(PICK_KEY) || '[]'); } catch { return []; }
}
function persistPicks() {
  const picked = selectedPapers();
  try { localStorage.setItem(PICK_KEY, JSON.stringify(picked)); } catch { /* 隐私模式忽略 */ }
}

function selectedPapers() {
  return Array.from(pickListEl.querySelectorAll('input[type="checkbox"]:checked')).map(i => i.value);
}

function refreshPickSummary() {
  const picked = selectedPapers();
  persistPicks();
  if (picked.length === 0) pickSummaryEl.textContent = '全部论文';
  else if (picked.length === 1) pickSummaryEl.textContent = '单篇：' + picked[0];
  else pickSummaryEl.textContent = `已选 ${picked.length} 篇（对比）`;
}

function loadPaperFiles() {
  // 每次上传/删除后重新拉一遍：勾选列表和论文库面板必须跟磁盘一致
  return fetch('/papers/files')
    .then(r => r.json())
    .then(d => {
      const keep = new Set(savedPicks());
      pickListEl.innerHTML = '';
      (d.files || []).forEach(f => {
        const label = document.createElement('label');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.value = f;
        box.checked = keep.has(f);
        box.addEventListener('change', refreshPickSummary);
        const name = document.createElement('span');
        name.textContent = f;
        label.appendChild(box);
        label.appendChild(name);
        pickListEl.appendChild(label);
      });
      refreshPickSummary();
    })
    .catch(() => {});
}

loadPaperFiles();

// ---------- 健康检查：确认后端活着 ----------
fetch('/health')
  .then(r => r.json())
  .then(d => {
    statusEl.textContent = `服务正常 · 模型 ${d.model} · v${d.version}`;
    statusEl.className = 'status ok';
  })
  .catch(() => {
    statusEl.textContent = '无法连接后端服务';
    statusEl.className = 'status bad';
  });


// ---------- 证据卡片：把检索到的原文、页码、融合分、命中通道摊开给用户看 ----------
function renderEvidence(botEl, items) {
  const box = document.createElement('div');
  box.className = 'evidence';

  if (!items || items.length === 0) {
    const miss = document.createElement('div');
    miss.className = 'ev miss';
    miss.innerHTML = '<div class="ev-head"><b>证据不足</b><span class="ev-badge">未检索到原文</span></div>' +
      '<div class="ev-text open">论文库里没有找到能回答这个问题的段落，因此系统应当拒答，而不是编造。</div>';
    box.appendChild(miss);
  } else {
    items.forEach(it => {
      const card = document.createElement('div');
      card.className = 'ev';
      const channels = (it.channels || []).join(' + ') || '未知';
      // score 有两种口径，后端用 score_type 区分（app/agent.py:980）：
      //   rrf    —— RRF 融合分，由多路名次换算，恒为正，不是"相似度概率"
      //   rerank —— 交叉编码器的原始 logit，可为负，越大越相关
      // 二者不可比，标签必须分开写；否则用户看到"融合分 -0.0777"会以为融合分能是负的。
      const isRerank = it.score_type === 'rerank';
      const scoreLabel = isRerank ? '重排分' : '融合分';
      const scoreTip = isRerank
        ? '交叉编码器对"问题—原文"打的原始分，可为负，越大越相关'
        : '多路召回按名次融合得到的分，恒为正，不是相似度概率';
      card.innerHTML =
        '<div class="ev-head">' +
        `<b>证据 #${it.rank}</b>` +
        `<span>第 ${it.page == null ? '?' : it.page} 页</span>` +
        `<span title="${scoreTip}">${scoreLabel} ${Number(it.score).toFixed(4)}</span>` +
        `<span>命中通道 ${channels}</span>` +
        `<span class="ev-badge">${it.source}</span>` +
        // 点一下直接翻到原文那一页：paper=文件名，page=1 基页码（阅读页会把该页滚到顶部）
        `<a class="ev-open" target="_blank" rel="noopener" ` +
        `href="/ui/reader.html?paper=${encodeURIComponent(it.source)}&page=${it.page == null ? 1 : it.page}">打开原文</a>` +
        '</div>' +
        `<div class="ev-text">${escapeHtml(it.text).slice(0, 400)}${it.text.length > 400 ? '…' : ''}</div>`;
      card.querySelector('.ev-text').addEventListener('click', e => {
        e.currentTarget.classList.toggle('open');
      });
      box.appendChild(card);
    });
  }
  botEl.insertAdjacentElement('afterend', box);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// ---------- 角色时间线：Planner → Retriever → Extractor → Verifier → Writer ----------
// 后端 app/agent.py 的 RoleRun 已经按执行顺序追加，这里按顺序画即可。
function renderRoles(botEl, items, status) {
  if (!items || items.length === 0) return null;
  const box = document.createElement('div');
  box.className = 'roles';

  const head = document.createElement('div');
  head.className = 'roles-head';
  head.innerHTML = '<b>多智能体协作</b>';
  if (status) {
    const st = document.createElement('span');
    st.className = 'role-status';
    st.textContent = status;
    head.appendChild(st);
  }
  box.appendChild(head);

  const list = document.createElement('div');
  list.className = 'role-list';
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'role' + (it.ok === false ? ' fail' : '');
    const ms = Number(it.duration_ms || 0);
    row.innerHTML =
      '<div class="role-dot"><i></i><span></span></div>' +
      '<div class="role-body">' +
      '<div class="role-title"><b>' + escapeHtml(it.label || it.role) + '</b>' +
      (ms ? `<span class="role-ms">${ms} ms</span>` : '') +
      '</div>' +
      '<div class="role-text">' + escapeHtml(it.summary || '') + '</div>' +
      '</div>';
    list.appendChild(row);
  });
  box.appendChild(list);
  botEl.insertAdjacentElement('afterend', box);
  return box;
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
  return div;
}

// ---------- 把模型输出的 Markdown 表格渲染成真表格（其余文字原样保留） ----------
function looksLikeRow(line) {
  return /^\s*\|.*\|\s*$/.test(line);
}

function buildTable(rows) {
  // 去掉 |---|---| 这种分隔行
  const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
  if (body.length < 2) return null;
  const splitCells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
  const table = document.createElement('table');
  table.className = 'cmp';
  body.forEach((row, idx) => {
    const tr = document.createElement('tr');
    splitCells(row).forEach(text => {
      const cell = document.createElement(idx === 0 ? 'th' : 'td');
      cell.textContent = text;  // 用 textContent，不解析 HTML，防注入
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  // 外面套一层：手机上表格可以横向滚动，不把整页撑破
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  wrap.appendChild(table);
  return wrap;
}

function renderAnswer(el, text) {
  el.textContent = '';
  const lines = text.split('\n');
  let buffer = [];
  const flush = () => {
    if (!buffer.length) return;
    const block = document.createElement('div');
    block.textContent = buffer.join('\n');
    el.appendChild(block);
    buffer = [];
  };
  for (let i = 0; i < lines.length; i++) {
    if (looksLikeRow(lines[i])) {
      const rows = [];
      while (i < lines.length && looksLikeRow(lines[i])) { rows.push(lines[i]); i++; }
      i--;
      const table = buildTable(rows);
      if (table) { flush(); el.appendChild(table); }
      else { buffer.push(...rows); }
    } else {
      buffer.push(lines[i]);
    }
  }
  flush();
}

// ---------- 核心：消费 SSE 流 ----------
async function send() {
  const question = inputEl.value.trim();
  if (!question) return;

  inputEl.value = '';
  autoGrow();
  sendEl.disabled = true;

  // 第一句提问就把空状态切成对话流，并开一个会话；后续提问往同一会话里追加
  if (UI_DEV_SAMPLE) { UI_DEV_SAMPLE = false; chatEl.innerHTML = ''; }
  document.body.classList.add('has-conv');
  let s = activeSession();
  if (!s) {
    s = newSession();
    s.title = makeTitle(question);
    sessions.push(s);
    activeId = s.id;
  }
  if (!s.title) s.title = makeTitle(question);

  addMsg(question, 'user');
  s.messages.push({ role: 'user', content: question });
  s.updatedAt = Date.now();
  saveSessions();
  sbRenderHistory();

  const botEl = addMsg('', 'bot');
  let traceEl = null;
  let answer = '';
  let evidenceItems = [];
  let roleItems = [];
  let statusText = '';

  try {
    // 勾了 1 篇 → 单篇；勾了 2 篇以上 → 多篇对比；一篇没勾 → 全库
    const picked = selectedPapers();
    // 发给后端的历史不含刚追加的这一句（后端会自己拼 message），取到上一轮为止
    const payload = { message: question, history: trimForApi(s.messages.slice(0, -1)) };
    if (picked.length === 1) payload.source = picked[0];
    if (picked.length >= 2) payload.sources = picked;
    // 智能搜索关掉 → 只跑 BM25 + 哈希，省掉稠密那一路的 embedding 计算
    if (!searchOn()) payload.use_dense = false;

    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + (await resp.text()).slice(0, 200));

    // 逐块读取响应体 —— 这就是"流式"在前端的样子
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 用空行分隔每条事件
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;

        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (ev.type === 'evidence') {
          evidenceItems = ev.items || [];
        } else if (ev.type === 'roles') {
          roleItems = ev.items || [];
        } else if (ev.type === 'status') {
          statusText = ev.text || '';
        } else if (ev.type === 'answer_delta') {
          answer += ev.text;
          botEl.textContent = answer;
        } else if (ev.type === 'tool_call') {
          traceEl = traceEl || addMsg('', 'trace');
          traceEl.textContent += `🔧 调用 ${ev.tool}(${ev.arguments})\n`;
        } else if (ev.type === 'tool_result') {
          traceEl = traceEl || addMsg('', 'trace');
          traceEl.textContent += `   ↳ ${ev.result}\n`;
        } else if (ev.type === 'error') {
          addMsg('服务出错：' + ev.message, 'err');
        }
        chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
      }
    }

    if (!answer) botEl.textContent = '（没有返回内容）';
    // 先画协作时间线，再画证据卡片：时间线讲"怎么找到这些证据"，放在证据上方更顺
    const rolesBox = roleItems.length ? renderRoles(botEl, roleItems, statusText) : null;
    renderEvidence(rolesBox || botEl, evidenceItems);

    // 成功拿到回答才记入历史：失败/空回答不污染下一轮
    if (answer) {
      s.messages.push({ role: 'assistant', content: answer });
      s.updatedAt = Date.now();
      saveSessions();
      sbRenderHistory();
    }
  } catch (e) {
    addMsg('请求失败：' + e.message, 'err');
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

// 输入框随内容长高，最多 40vh（超过就自己滚），避免长问题被截成一行看不清
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, Math.round(window.innerHeight * 0.4)) + 'px';
}

// Shift+Enter 换行，Enter 直接发（和 DeepSeek 一致）；输入法组合中的回车不算发送
inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  send();
});
sendEl.addEventListener('click', send);
autoGrow();

// 侧栏（折叠 / 拖宽 / 历史）由共用的 sidebar.js 负责，在那个 script 标签里
document.getElementById('newChat').addEventListener('click', startNewChat);
// 对话页改动了会话列表，从别的页 bfcache 回来时把侧栏历史重画一遍
window.addEventListener('pageshow', () => sbRenderHistory());

// ---------- 智能搜索开关（真开关，不是装饰） ----------
// 开 = 稠密语义 + BM25 关键词 + 哈希字面 三路召回；关 = 只跑 BM25 + 哈希两路。
// 关掉稠密那一路之后，就不需要再加载 embedding 模型，本地也能省一大截耗时。
// 状态存在 localStorage，刷新后保持；每次提问把它作为 use_dense 传给后端。
const SEARCH_KEY = 'campus-agent-smart-search-v1';

function searchOn() {
  try { return localStorage.getItem(SEARCH_KEY) !== '0'; } catch (e) { return true; }
}

function applySearchChip() {
  const on = searchOn();
  const chip = document.getElementById('chipSearch');
  if (!chip) return;
  chip.classList.toggle('on', on);
  chip.setAttribute('aria-pressed', on ? 'true' : 'false');
  chip.title = on
    ? '智能搜索：开启中（稠密 + BM25 + 哈希三路召回）。点击关闭，改为只用 BM25 + 哈希'
    : '智能搜索：已关闭（只用 BM25 + 哈希两路）。点击开启稠密语义召回';
}

document.getElementById('chipSearch').addEventListener('click', () => {
  const next = !searchOn();
  try { localStorage.setItem(SEARCH_KEY, next ? '1' : '0'); } catch (e) { /* 隐私模式忽略 */ }
  applySearchChip();
});
applySearchChip();

// ---------- 对话正文宽度拖动（右侧竖条） ----------
// 和侧栏宽度是一对：侧栏抓手改 --sidebar-w，这里改 --chat-w，两者都写 :root 并持久化。
// 夹在 520~1400px 之间；再把上限收在主区实际可用宽度内，防止拖出横向滚动条。
const CHAT_W_KEY = 'campus-agent-chat-w-v1';
const CHAT_W_MIN = 520;
const CHAT_W_MAX = 1400;
const CHAT_W_DEFAULT = 820;
const mainResizerEl = document.getElementById('mainResizer');

function clampChatWidth(w) {
  const mainEl = document.querySelector('.app__main');
  const room = mainEl ? mainEl.getBoundingClientRect().width - 48 : CHAT_W_MAX;
  const hi = Math.max(CHAT_W_MIN, Math.min(CHAT_W_MAX, room));
  return Math.round(Math.min(Math.max(w, CHAT_W_MIN), hi));
}

function currentChatWidth() {
  const inner = document.getElementById('chat');
  return inner ? Math.round(inner.getBoundingClientRect().width) : CHAT_W_DEFAULT;
}

function applyChatWidth(w) {
  document.documentElement.style.setProperty('--chat-w', w + 'px');
}

function persistChatWidth(w) {
  try { localStorage.setItem(CHAT_W_KEY, String(w)); } catch (e) { /* 隐私模式忽略 */ }
}

if (mainResizerEl) {
  mainResizerEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = currentChatWidth();
    mainResizerEl.classList.add('dragging');
    document.body.classList.add('is-resizing');
    mainResizerEl.setPointerCapture(e.pointerId);

    // 抓手在主区右边：往左拖（clientX 变小）正文变窄，往右拖变宽
    const onMove = ev => applyChatWidth(clampChatWidth(startW + (ev.clientX - startX) * 2));
    const onUp = () => {
      mainResizerEl.classList.remove('dragging');
      document.body.classList.remove('is-resizing');
      mainResizerEl.removeEventListener('pointermove', onMove);
      mainResizerEl.removeEventListener('pointerup', onUp);
      mainResizerEl.removeEventListener('pointercancel', onUp);
      persistChatWidth(currentChatWidth());
    };
    mainResizerEl.addEventListener('pointermove', onMove);
    mainResizerEl.addEventListener('pointerup', onUp);
    mainResizerEl.addEventListener('pointercancel', onUp);
  });

  mainResizerEl.addEventListener('dblclick', () => {
    applyChatWidth(CHAT_W_DEFAULT);
    persistChatWidth(CHAT_W_DEFAULT);
  });
}

inputEl.focus();

</script>
