<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科研小助手</title>
  <!-- 故意不用 React/Vue：第 3 周的目标是"能公网访问"，
       不是"前端写得漂亮"。等核心功能稳了再考虑换框架。 -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; height: 100vh; display: flex;
      flex-direction: column; align-items: center;
    }
    header { width: 100%; max-width: 820px; padding: 20px 16px 12px; }
    .hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 18px; color: #1a1a1a; }
    button.ghost { background: #fff; color: #374151; border: 1px solid #d5d9e0;
                   font-size: 13px; padding: 8px 12px; border-radius: 8px; }
    .status { font-size: 12px; color: #888; margin-top: 4px; }
    .status.ok { color: #14a44d; }
    .status.bad { color: #dc3545; }

    #chat {
      flex: 1; width: 100%; max-width: 820px; overflow-y: auto;
      padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px;
           line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .user { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 3px; }
    .bot  { align-self: flex-start; background: #fff; color: #222;
            border-bottom-left-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .trace { align-self: flex-start; font-size: 12px; color: #6b7280;
             background: #eef1f5; border-radius: 8px; padding: 8px 12px;
             font-family: Consolas, monospace; max-width: 82%; white-space: pre-wrap; }
    .err { align-self: center; color: #dc3545; font-size: 13px; }

    /* 证据卡片：回答下方的"可核验"区块 —— 评委一眼能看到检索到了什么 */
    .evidence { align-self: flex-start; width: 82%; display: flex; flex-direction: column;
                gap: 8px; margin-top: -4px; }
    .ev { background: #fff; border: 1px solid #e3e7ee; border-left: 3px solid #1a73e8;
          border-radius: 10px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .ev.miss { border-left-color: #dc3545; }
    .ev-head { font-size: 12px; color: #6b7280; display: flex; gap: 10px; flex-wrap: wrap; }
    .ev-head b { color: #1a73e8; font-weight: 600; }
    .ev-text { font-size: 13px; color: #333; line-height: 1.6; margin-top: 6px;
               max-height: 96px; overflow: hidden; position: relative; cursor: pointer; }
    .ev-text.open { max-height: none; }
    .ev-badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #eef1f5; color: #6b7280; }

    footer { width: 100%; max-width: 820px; padding: 12px 16px 20px; display: flex; gap: 8px; position: relative; }
    #q { flex: 1; padding: 12px 14px; border: 1px solid #d5d9e0; border-radius: 10px;
         font-size: 15px; outline: none; }
    #q:focus { border-color: #1a73e8; }
    button { padding: 12px 22px; border: none; border-radius: 10px;
             background: #1a73e8; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { background: #a9c3e8; cursor: not-allowed; }

    /* 多篇对比：点开才是勾选列表，收起时不占地方 */
    .pick { position: relative; }
    .pick > summary { list-style: none; cursor: pointer; padding: 11px 12px; border: 1px solid #d5d9e0;
                      border-radius: 10px; font-size: 13px; color: #374151; background: #fff;
                      white-space: nowrap; user-select: none; }
    .pick > summary::-webkit-details-marker { display: none; }
    .pick[open] > summary { border-color: #1a73e8; color: #1a73e8; }
    .pick-list { position: absolute; bottom: 52px; left: 0; width: 360px; max-height: 260px; overflow: auto;
                 background: #fff; border: 1px solid #d5d9e0; border-radius: 10px;
                 box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; z-index: 10; }
    .pick-list label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; font-size: 13px;
                       border-radius: 6px; cursor: pointer; }
    .pick-list label:hover { background: #f4f7fb; }
    .pick-list input { margin: 0; }

    /* 对比表：模型输出 Markdown 表格时渲染成真正的表格 */
    table.cmp { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; }
    table.cmp th, table.cmp td { border: 1px solid #d9dee5; padding: 6px 8px; text-align: left; vertical-align: top; }
    table.cmp th { background: #f2f6fc; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <h1>📚 科研小助手</h1>
      <button id="newChat" class="ghost" title="清空对话历史，重新开始">新对话</button>
    </div>
    <div class="status" id="status">检查服务状态…</div>
  </header>

  <div id="chat">
    <div class="msg bot">你好！我是科研小助手，可以帮你读论文、找原文、做对比。试着问我：<br />· Attention Is All You Need 的第 6 作者是谁？<br />· Adam 优化器的 β1、β2 设为多少？<br />· 这篇论文训练用了多少块 GPU？</div>
  </div>

  <footer>
    <details class="pick" id="pick">
      <summary id="pickSummary">全部论文</summary>
      <div class="pick-list" id="pickList"></div>
    </details>
    <input id="q" placeholder="输入你的问题，回车发送…" autocomplete="off" />
    <button id="send">发送</button>
  </footer>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('q');
const sendEl = document.getElementById('send');
const statusEl = document.getElementById('status');
const pickEl = document.getElementById('pick');
const pickListEl = document.getElementById('pickList');
const pickSummaryEl = document.getElementById('pickSummary');

// ---------- 多轮对话历史 ----------
// 后端 /chat 本来就会把 history 拼进 messages（app/agent.py:571），
// 但之前网页版每轮都发空数组，等于把"记忆"这一半关掉了。这里补在前端。
const HISTORY_KEY = 'campus-agent-history-v1';
const HISTORY_MAX_MSGS = 12;     // 6 轮（user + assistant 各一条算一轮）
const HISTORY_MAX_CHARS = 1000;  // 单条截断，防 token 越滚越大

let history = loadHistory();

function loadHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(arr) ? arr.filter(m => m && m.role && m.content) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) { /* 隐私模式忽略 */ }
}

function trimHistory() {
  history = history.slice(-HISTORY_MAX_MSGS).map(m => ({
    role: m.role,
    content: String(m.content).slice(0, HISTORY_MAX_CHARS),
  }));
}

// 刷新后把历史重新画出来（只恢复文字，不重放证据卡片）
history.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot'));

// 论文多选：勾 0 篇 = 全库检索；勾 1 篇 = 单篇问答；勾 2 篇及以上 = 多篇对比
// 选择存 localStorage：刷新/换页后不清空，避免"勾了但没发出去"
const PICK_KEY = 'campus-agent-picks-v1';
function savedPicks() {
  try { return JSON.parse(localStorage.getItem(PICK_KEY) || '[]'); } catch { return []; }
}
function persistPicks() {
  const picked = selectedPapers();
  try { localStorage.setItem(PICK_KEY, JSON.stringify(picked)); } catch { /* 隐私模式忽略 */ }
}

function selectedPapers() {
  return Array.from(pickListEl.querySelectorAll('input[type="checkbox"]:checked')).map(i => i.value);
}

function refreshPickSummary() {
  const picked = selectedPapers();
  persistPicks();
  if (picked.length === 0) pickSummaryEl.textContent = '全部论文';
  else if (picked.length === 1) pickSummaryEl.textContent = '单篇：' + picked[0];
  else pickSummaryEl.textContent = `已选 ${picked.length} 篇（对比）`;
}

fetch('/papers/files')
  .then(r => r.json())
  .then(d => {
    const keep = new Set(savedPicks());
    (d.files || []).forEach(f => {
      const label = document.createElement('label');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.value = f;
      box.checked = keep.has(f);
      box.addEventListener('change', refreshPickSummary);
      const name = document.createElement('span');
      name.textContent = f;
      label.appendChild(box);
      label.appendChild(name);
      pickListEl.appendChild(label);
    });
    refreshPickSummary();
  })
  .catch(() => {});

// ---------- 健康检查：确认后端活着 ----------
fetch('/health')
  .then(r => r.json())
  .then(d => {
    statusEl.textContent = `服务正常 · 模型 ${d.model} · v${d.version}`;
    statusEl.className = 'status ok';
  })
  .catch(() => {
    statusEl.textContent = '无法连接后端服务';
    statusEl.className = 'status bad';
  });


// ---------- 证据卡片：把检索到的原文、页码、融合分、命中通道摊开给用户看 ----------
function renderEvidence(botEl, items) {
  const box = document.createElement('div');
  box.className = 'evidence';

  if (!items || items.length === 0) {
    const miss = document.createElement('div');
    miss.className = 'ev miss';
    miss.innerHTML = '<div class="ev-head"><b>证据不足</b><span class="ev-badge">未检索到原文</span></div>' +
      '<div class="ev-text open">论文库里没有找到能回答这个问题的段落，因此系统应当拒答，而不是编造。</div>';
    box.appendChild(miss);
  } else {
    items.forEach(it => {
      const card = document.createElement('div');
      card.className = 'ev';
      const channels = (it.channels || []).join(' + ') || '未知';
      // 注意：score 是 RRF 融合分（由多路名次换算），不是"相似度概率"
      card.innerHTML =
        '<div class="ev-head">' +
        `<b>证据 #${it.rank}</b>` +
        `<span>第 ${it.page == null ? '?' : it.page} 页</span>` +
        `<span>融合分 ${Number(it.score).toFixed(4)}</span>` +
        `<span>命中通道 ${channels}</span>` +
        `<span class="ev-badge">${it.source}</span>` +
        '</div>' +
        `<div class="ev-text">${escapeHtml(it.text).slice(0, 400)}${it.text.length > 400 ? '…' : ''}</div>`;
      card.querySelector('.ev-text').addEventListener('click', e => {
        e.currentTarget.classList.toggle('open');
      });
      box.appendChild(card);
    });
  }
  botEl.insertAdjacentElement('afterend', box);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// ---------- 把模型输出的 Markdown 表格渲染成真表格（其余文字原样保留） ----------
function looksLikeRow(line) {
  return /^\s*\|.*\|\s*$/.test(line);
}

function buildTable(rows) {
  // 去掉 |---|---| 这种分隔行
  const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
  if (body.length < 2) return null;
  const splitCells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
  const table = document.createElement('table');
  table.className = 'cmp';
  body.forEach((row, idx) => {
    const tr = document.createElement('tr');
    splitCells(row).forEach(text => {
      const cell = document.createElement(idx === 0 ? 'th' : 'td');
      cell.textContent = text;  // 用 textContent，不解析 HTML，防注入
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  return table;
}

function renderAnswer(el, text) {
  el.textContent = '';
  const lines = text.split('\n');
  let buffer = [];
  const flush = () => {
    if (!buffer.length) return;
    const block = document.createElement('div');
    block.textContent = buffer.join('\n');
    el.appendChild(block);
    buffer = [];
  };
  for (let i = 0; i < lines.length; i++) {
    if (looksLikeRow(lines[i])) {
      const rows = [];
      while (i < lines.length && looksLikeRow(lines[i])) { rows.push(lines[i]); i++; }
      i--;
      const table = buildTable(rows);
      if (table) { flush(); el.appendChild(table); }
      else { buffer.push(...rows); }
    } else {
      buffer.push(lines[i]);
    }
  }
  flush();
}

// ---------- 核心：消费 SSE 流 ----------
async function send() {
  const question = inputEl.value.trim();
  if (!question) return;

  inputEl.value = '';
  sendEl.disabled = true;
  addMsg(question, 'user');

  const botEl = addMsg('', 'bot');
  let traceEl = null;
  let answer = '';
  let evidenceItems = [];

  try {
    // 勾了 1 篇 → 单篇；勾了 2 篇以上 → 多篇对比；一篇没勾 → 全库
    const picked = selectedPapers();
    const payload = { message: question, history: history.slice() };
    if (picked.length === 1) payload.source = picked[0];
    if (picked.length >= 2) payload.sources = picked;

    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + (await resp.text()).slice(0, 200));

    // 逐块读取响应体 —— 这就是"流式"在前端的样子
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 用空行分隔每条事件
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;

        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (ev.type === 'evidence') {
          evidenceItems = ev.items || [];
        } else if (ev.type === 'answer_delta') {
          answer += ev.text;
          botEl.textContent = answer;
        } else if (ev.type === 'tool_call') {
          traceEl = traceEl || addMsg('', 'trace');
          traceEl.textContent += `🔧 调用 ${ev.tool}(${ev.arguments})\n`;
        } else if (ev.type === 'tool_result') {
          traceEl = traceEl || addMsg('', 'trace');
          traceEl.textContent += `   ↳ ${ev.result}\n`;
        } else if (ev.type === 'error') {
          addMsg('服务出错：' + ev.message, 'err');
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    if (!answer) botEl.textContent = '（没有返回内容）';
    renderEvidence(botEl, evidenceItems);

    // 成功拿到回答才记入历史：失败/空回答不污染下一轮
    if (answer) {
      history.push({ role: 'user', content: question });
      history.push({ role: 'assistant', content: answer });
      trimHistory();
      saveHistory();
    }
  } catch (e) {
    addMsg('请求失败：' + e.message, 'err');
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

document.getElementById('newChat').addEventListener('click', () => {
  history = [];
  saveHistory();
  chatEl.innerHTML = '';
  addMsg('新对话开始。试着问我：这篇论文训练用了多少块 GPU？', 'bot');
  inputEl.focus();
});

inputEl.focus();
</script>
</body>
</html>
