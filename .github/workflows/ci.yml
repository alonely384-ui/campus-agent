name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check requirements.txt is in sync with imports
        # 防止「改了 import 忘改 requirements.txt」，那样别人装完起不来服务
        run: python scripts/check_deps.py

      - name: Test (pytest)
        # 测试全部使用假配置，不依赖真实 API Key
        env:
          LLM_API_KEY: sk-test-not-a-real-key
        run: pytest -v
