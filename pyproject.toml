[project]
name = "campus-agent"
version = "0.1.0"
description = "校园智能助手 Agent：RAG 问答 + 工具调用 + 流式输出"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.50",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "tiktoken>=0.8",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "httpx>=0.27",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 常用规则：语法错误 / import 顺序 / 未使用变量 / 命名
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
