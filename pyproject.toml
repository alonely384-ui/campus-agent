[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 只把 app/ 当作代码包。
# 不写这段的话 setuptools 会自动扫描，看到 app/ tests/ eval/ scripts/ 好几个目录
# 就不知道哪个才是包，直接报 "Multiple top-level packages discovered" 然后装不上。
[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "campus-agent"
version = "0.1.0"
description = "校园智能助手 Agent：RAG 问答 + 工具调用 + 流式输出"
requires-python = ">=3.11"
# 依赖只有 requirements.txt 一处真源，这里刻意不重复写。
#
# 为什么删掉原来的 dependencies 列表：它和 requirements.txt 是两套互相矛盾的清单——
# 这边缺了 pymupdf / numpy / pandas / matplotlib / rapidocr / onnxruntime / tokenizers，
# 多了两边早就从代码里删掉的 redis / sqlalchemy / pymysql / aiohttp / sse-starlette / tiktoken。
# 结果 `pip install -e .` 装完 import fitz 直接 ImportError。
# 重复维护两套清单必然再次走偏，所以这里留空，装依赖一律走：
#     pip install -r requirements.txt
# 依赖是否与 app/ 的实际 import 对齐，由 scripts/check_deps.py 核对（已挂 CI）。
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 常用规则：语法错误 / import 顺序 / 未使用变量 / 命名
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的惯例就是 File(...) / Depends(...) 直接写在参数默认值里，
# 这是框架规定的写法，不是 bug，所以对 main.py 关掉 B008 这条检查。
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
