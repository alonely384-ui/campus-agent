[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 只把 app/ 当作代码包。
# 不写这段的话 setuptools 会自动扫描，看到 app/ tests/ eval/ scripts/ 好几个目录
# 就不知道哪个才是包，直接报 "Multiple top-level packages discovered" 然后装不上。
[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "campus-agent"
# 版本号是全项目唯一的真源：app/main.py 的 _read_version() 只从这里读，
# 代码里不再硬编码第二份（两处写死迟早对不上）。
# 递增规则：第二位 = 功能批次，第三位 = 修复批次。
#   0.0.0  2026-09-22 项目骨架
#   0.1.0  1.1~1.6 六模块跑通（解析 / RAG / 阅读器 / 推荐 / 图谱 / 写作）
#   1.0.0  2026-10-30 设置中心 + 设计系统迁移
#   1.1.0  2026-11-01 安全整改（路由对账 / 管理员认证 / 限流 / 预算）
#   1.1.1  2026-11-04 事件循环阻塞修复 + 侧栏与页脚修复
#   2.0.0  2026-11-04 桌面版 exe + 五类错误重试
#   2.0.1  2026-11-04 重排模型路径修复（桌面版静默降级）
#   2.1.0  2026-11-04 七家厂商一键切换
version = "2.1.0"
description = "科研小助手：基于 RAG 与引用图谱的论文阅读与写作 Agent"
requires-python = ">=3.11"
# 依赖只有 requirements.txt 一处真源，这里刻意不重复写。
#
# 为什么删掉原来的 dependencies 列表：它和 requirements.txt 是两套互相矛盾的清单——
# 这边缺了 pymupdf / numpy / pandas / matplotlib / rapidocr / onnxruntime / tokenizers，
# 多了两边早就从代码里删掉的 redis / sqlalchemy / pymysql / aiohttp / sse-starlette / tiktoken。
# 结果 `pip install -e .` 装完 import fitz 直接 ImportError。
# 重复维护两套清单必然再次走偏，所以这里留空，装依赖一律走：
#     pip install -r requirements.txt
# 依赖是否与 app/ 的实际 import 对齐，由 scripts/check_deps.py 核对（已挂 CI）。
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 常用规则：语法错误 / import 顺序 / 未使用变量 / 命名
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的惯例就是 File(...) / Depends(...) 直接写在参数默认值里，
# 这是框架规定的写法，不是 bug，所以对 main.py 关掉 B008 这条检查。
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
